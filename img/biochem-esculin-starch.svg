<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>七叶苷与淀粉水解试验</title>
<desc>七叶苷水解产物七叶素与枸橼酸铁结合变黑为阳性（胆汁七叶苷 BEA 兼筛肠球菌）；淀粉水解菌落周围加碘液后呈无色透明区，未水解区呈蓝色。典型：克雷伯/肠杆菌/沙雷与肠球菌七叶苷＋；白喉棒杆菌重型淀粉酶＋，轻/中型−</desc>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="300" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">七叶苷水解 与 淀粉水解试验</text>
<rect x="392" y="14" width="64" height="18" rx="9" fill="#eef2f7"/>
<text x="424" y="27" text-anchor="middle" font-size="10" fill="#5c6672">生化试验</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">大分子水解类：一个看「变黑」，一个看「碘染后透明区」</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 左：七叶苷（管变黑） ===== -->
<text x="24" y="78" font-size="10.5" font-weight="700" fill="#33404f">七叶苷水解：七叶素＋Fe³⁺ → 黑色螯合物</text>
<text x="24" y="92" font-size="9.5" fill="#5c6672">斜面/肉汤 35℃ 24～48 h：变黑＝阳性；BEA 版兼筛胆汁耐受</text>
<!-- 阴性管 -->
<text x="66" y="112" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33404f">阴性（−）</text>
<path d="M48,120 L48,206 Q48,222 66,222 Q84,222 84,206 L84,120 Z" fill="#f2ecdd" stroke="#b9c2cc" stroke-width="1.5"/>
<path d="M48,172 L84,148 L84,206 Q84,222 66,222 Q48,222 48,206 Z" fill="#e8dfc8"/>
<line x1="48" y1="172" x2="84" y2="148" stroke="#c9bfa8" stroke-width="1.1"/>
<ellipse cx="66" cy="120" rx="18" ry="4.5" fill="#eef2f7" stroke="#b9c2cc" stroke-width="1.3"/>
<text x="66" y="238" text-anchor="middle" font-size="9.5" fill="#5c6672">不变色</text>
<!-- 阳性管 -->
<text x="150" y="112" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33404f">阳性（＋）</text>
<path d="M132,120 L132,206 Q132,222 150,222 Q168,222 168,206 L168,120 Z" fill="#3a3f45" stroke="#b9c2cc" stroke-width="1.5"/>
<path d="M132,172 L168,148 L168,206 Q168,222 150,222 Q132,222 132,206 Z" fill="#23272c"/>
<line x1="132" y1="172" x2="168" y2="148" stroke="#15181b" stroke-width="1.1"/>
<ellipse cx="150" cy="120" rx="18" ry="4.5" fill="#eef2f7" stroke="#b9c2cc" stroke-width="1.3"/>
<text x="150" y="238" text-anchor="middle" font-size="9.5" fill="#33404f">培养基变黑</text>

<!-- ===== 右：淀粉水解（碘透明区） ===== -->
<text x="252" y="78" font-size="10.5" font-weight="700" fill="#33404f">淀粉水解：加碘液后菌落周围透明</text>
<text x="252" y="92" font-size="9.5" fill="#5c6672">淀粉血清琼脂 35℃ 18～24 h，革兰碘液数滴立即读</text>
<!-- 平板（碘蓝底） -->
<ellipse cx="366" cy="168" rx="98" ry="54" fill="#2c4a7c" stroke="#8c96a2" stroke-width="1.5"/>
<!-- 透明区 -->
<circle cx="352" cy="166" r="27" fill="#f0ece2" fill-opacity="0.92"/>
<circle cx="352" cy="166" r="27" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
<!-- 菌落 -->
<circle cx="352" cy="166" r="7" fill="#c8b7a0" stroke="#8c96a2" stroke-width="1"/>
<text x="352" y="169" text-anchor="middle" font-size="9.5" fill="#33404f">菌落</text>
<line x1="352" y1="166" x2="379" y2="166" stroke="#33404f" stroke-width="1.2"/>
<text x="384" y="169" font-size="9.5" fill="#33404f">透明区</text>
<text x="300" y="238" font-size="9.5" fill="#5c6672">未水解区碘染呈蓝色 → 阳性＝周边无色透明</text>

<!-- 页脚 -->
<rect x="24" y="254" width="432" height="38" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="32" y="269" font-size="9.5" fill="#5c6672"><tspan font-weight="700" fill="#33404f">典型菌</tspan>　七叶苷＋：克雷伯菌属/肠杆菌属/沙雷菌属、肠球菌属与 D 群链球菌（BEA 双阳）</text>
<text x="32" y="285" font-size="9.5" fill="#5c6672">淀粉酶＋：白喉棒杆菌重型（轻/中型−）、芽孢杆菌属；透明区大小与酶活正相关</text>
</svg>
