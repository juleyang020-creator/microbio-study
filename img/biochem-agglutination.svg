<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>血清学凝集试验（玻片法与试管法）</title>
<desc>玻片凝集：颗粒抗原与诊断血清数分钟内凝集成块，定性，注意 Vi/K 封闭抗原需煮沸破坏后复试；试管凝集：系列倍比稀释抗血清与等量抗原孵育，以最高稀释度仍凝集者为效价，半定量，肥达/外斐/布鲁菌试验的基础</desc>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="300" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">血清学凝集试验</text>
<rect x="392" y="14" width="64" height="18" rx="9" fill="#eef2f7"/>
<text x="424" y="27" text-anchor="middle" font-size="10" fill="#5c6672">生化试验</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">细菌抗原 ＋ 已知抗体：玻片法定性速判，试管法定量效价</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 上：玻片凝集 ===== -->
<text x="24" y="78" font-size="10.5" font-weight="700" fill="#33404f">玻片凝集（定性 · 数分钟）</text>
<!-- 玻片 -->
<rect x="32" y="88" width="200" height="64" rx="6" fill="#ffffff" stroke="#cfd6de" stroke-width="1.3"/>
<circle cx="32" cy="120" r="4" fill="#8c96a2"/><circle cx="232" cy="120" r="4" fill="#8c96a2"/>
<!-- 左半：凝集块 -->
<text x="82" y="102" text-anchor="middle" font-size="9.5" fill="#2f7a45" font-weight="600">阳性</text>
<path d="M58,120 l10,-8 l10,8 l-10,8 z" fill="#5c8ac0"/>
<path d="M74,132 l8,-6 l8,6 l-8,8 z" fill="#4a76a8"/>
<path d="M88,116 l9,-7 l9,7 l-9,8 z" fill="#5c8ac0"/>
<path d="M66,108 l7,-5 l7,5 l-7,7 z" fill="#4a76a8"/>
<text x="82" y="152" text-anchor="middle" font-size="9.5" fill="#33404f">颗粒凝集成块</text>
<!-- 右半：均匀悬液 -->
<text x="182" y="102" text-anchor="middle" font-size="9.5" fill="#c2413d" font-weight="600">阴性</text>
<circle cx="162" cy="120" r="2.4" fill="#8fb0d4"/><circle cx="176" cy="114" r="2" fill="#8fb0d4"/>
<circle cx="190" cy="122" r="2.2" fill="#8fb0d4"/><circle cx="202" cy="116" r="2" fill="#8fb0d4"/>
<circle cx="170" cy="130" r="2" fill="#8fb0d4"/><circle cx="196" cy="132" r="1.8" fill="#8fb0d4"/>
<text x="182" y="152" text-anchor="middle" font-size="9.5" fill="#33404f">均匀混悬不凝</text>
<text x="132" y="166" text-anchor="middle" font-size="9.5" fill="#5c6672">诊断血清＋待检菌；Vi/K 封闭致假阴性</text>
<text x="132" y="177" text-anchor="middle" font-size="9.5" fill="#5c6672">→ 100℃ 煮沸（Vi 30 min / K 1 h）后复试</text>

<!-- ===== 下：试管凝集（倍比稀释） ===== -->
<text x="24" y="196" font-size="10.5" font-weight="700" fill="#33404f">试管凝集（半定量 · 效价）</text>
<text x="24" y="209" font-size="9.5" fill="#5c6672">血清倍比稀释＋等量抗原，35~37℃ 4 h 后室温过夜，逐管读凝集程度</text>
<!-- 稀释系列 5 管 -->
<g>
  <path d="M36,218 L36,256 Q36,264 46,264 Q56,264 56,256 L56,218 Z" fill="#c8d8ea" stroke="#8c96a2" stroke-width="1.1"/>
  <path d="M70,218 L70,256 Q70,264 80,264 Q90,264 90,256 L90,218 Z" fill="#c8d8ea" stroke="#8c96a2" stroke-width="1.1"/>
  <path d="M104,218 L104,256 Q104,264 114,264 Q124,264 124,256 L124,218 Z" fill="#d5e2ef" stroke="#8c96a2" stroke-width="1.1"/>
  <path d="M138,218 L138,256 Q138,264 148,264 Q158,264 158,256 L138,218 Z" fill="#e2ecf5" stroke="#8c96a2" stroke-width="1.1"/>
  <path d="M172,218 L172,256 Q172,264 182,264 Q192,264 192,256 L192,218 Z" fill="#f2f6fa" stroke="#8c96a2" stroke-width="1.1"/>
  <!-- 凝集颗粒（前 3 管有） -->
  <circle cx="46" cy="240" r="2.4" fill="#4a76a8"/><circle cx="42" cy="248" r="2" fill="#4a76a8"/><circle cx="50" cy="250" r="1.8" fill="#4a76a8"/>
  <circle cx="80" cy="242" r="2.2" fill="#4a76a8"/><circle cx="76" cy="250" r="1.8" fill="#4a76a8"/>
  <circle cx="114" cy="244" r="2" fill="#4a76a8"/>
</g>
<text x="46" y="278" text-anchor="middle" font-size="9.5" fill="#5c6672">1:20</text>
<text x="80" y="278" text-anchor="middle" font-size="9.5" fill="#5c6672">1:40</text>
<text x="114" y="278" text-anchor="middle" font-size="9.5" fill="#5c6672">1:80</text>
<text x="148" y="278" text-anchor="middle" font-size="9.5" fill="#5c6672">1:160</text>
<text x="182" y="278" text-anchor="middle" font-size="9.5" fill="#5c6672">1:320</text>
<!-- 效价标注 -->
<line x1="114" y1="284" x2="114" y2="270" stroke="#c2413d" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="132" y="288" font-size="9.5" fill="#c2413d">效价 1:80</text>
<!-- 右侧应用 -->
<text x="252" y="230" font-size="9.5" fill="#33404f" font-weight="600">临床应用（测患者抗体）</text>
<text x="252" y="246" font-size="9.5" fill="#5c6672">肥达试验：伤寒/副伤寒 O 与 H 抗体</text>
<text x="252" y="258" font-size="9.5" fill="#5c6672">外斐试验：立克次体（变形杆菌 OX 抗原替代）</text>
<text x="252" y="270" font-size="9.5" fill="#5c6672">布鲁菌凝集试验；免疫血清效价标定</text>

<!-- 页脚 -->
<rect x="24" y="282" width="432" height="14" rx="4" fill="none"/>
<text x="240" y="295" text-anchor="middle" font-size="9.5" fill="#5c6672">玻片法用于菌体鉴定分型（沙门/志贺/霍乱/脑膜炎奈瑟菌…）；试管法看双份血清 4 倍升高更有意义</text>
</svg>
