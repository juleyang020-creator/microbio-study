<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 318" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>O/129 抑菌试验与黏丝试验</title>
<desc>左：O/129 蝶啶纸片抑制弧菌属与邻单胞菌属（敏感=有抑菌环），气单胞菌属耐药无环，为腹泻标本弧菌科属间鉴别的关键试验；右：0.5% 去氧胆酸钠悬液 1 分钟内由混变清并拉出黏丝为霍乱弧菌阳性，气单胞菌阴性，两者互证</desc>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="318" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">O/129 抑菌试验 与 黏丝试验</text>
<rect x="392" y="14" width="64" height="18" rx="9" fill="#eef2f7"/>
<text x="424" y="27" text-anchor="middle" font-size="10" fill="#5c6672">生化试验</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">弧菌科鉴别的经典组合：蝶啶纸片看抑菌环，去氧胆酸钠看拉丝</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 左：O/129 平板 ===== -->
<text x="24" y="76" font-size="10.5" font-weight="700" fill="#33404f">O/129（2,4-二氨基-6,7-二异丙基蝶啶）纸片</text>
<text x="24" y="90" font-size="9.5" fill="#5c6672">贴于碱性琼脂 / MH 平板，35℃ 16～24 h 读抑菌环</text>
<!-- 平板 -->
<ellipse cx="128" cy="158" rx="94" ry="52" fill="#f2ede3" stroke="#c9bfa8" stroke-width="1.6"/>
<ellipse cx="128" cy="158" rx="86" ry="46" fill="none" stroke="#ddd3bc" stroke-width="1"/>
<!-- 菌落散布 -->
<g fill="#c8b7a0">
  <circle cx="72" cy="142" r="2.2"/><circle cx="92" cy="184" r="2"/><circle cx="110" cy="128" r="1.8"/>
  <circle cx="148" cy="182" r="2.1"/><circle cx="170" cy="144" r="1.9"/><circle cx="196" cy="172" r="2.2"/>
  <circle cx="196" cy="134" r="1.8"/><circle cx="64" cy="172" r="1.9"/><circle cx="140" cy="194" r="1.7"/>
</g>
<!-- 敏感纸片 + 抑菌环 -->
<circle cx="96" cy="156" r="24" fill="#ffffff" fill-opacity="0.85"/>
<circle cx="96" cy="156" r="24" fill="none" stroke="#c9bfa8" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="96" cy="156" r="11" fill="#e8e4da" stroke="#8c96a2" stroke-width="1.2"/>
<text x="96" y="159" text-anchor="middle" font-size="9.5" fill="#33404f">150</text>
<!-- 耐药纸片（无环，菌落长到贴边） -->
<circle cx="176" cy="166" r="11" fill="#e8e4da" stroke="#8c96a2" stroke-width="1.2"/>
<text x="176" y="169" text-anchor="middle" font-size="9.5" fill="#33404f">150</text>
<circle cx="163" cy="160" r="2" fill="#c8b7a0"/><circle cx="190" cy="172" r="2" fill="#c8b7a0"/>
<circle cx="182" cy="153" r="1.7" fill="#c8b7a0"/><circle cx="170" cy="179" r="1.7" fill="#c8b7a0"/>
<!-- 标注 -->
<text x="128" y="224" text-anchor="middle" font-size="9.5" fill="#2f7a45" font-weight="600">敏感（有抑菌环）＝ 弧菌属 · 邻单胞菌属</text>
<text x="128" y="238" text-anchor="middle" font-size="9.5" fill="#c2413d" font-weight="600">耐药（150μg 无环）＝ 气单胞菌属 · 假单胞菌属</text>

<!-- ===== 右：黏丝试验 ===== -->
<text x="268" y="76" font-size="10.5" font-weight="700" fill="#33404f">黏丝试验（0.5% 去氧胆酸钠）</text>
<text x="268" y="90" font-size="9.5" fill="#5c6672">浓菌悬液加试剂，1 min 内接种环挑起观察</text>
<!-- 阳性：拉丝 -->
<text x="322" y="106" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2f7a45">阳性（＋）</text>
<rect x="284" y="112" width="76" height="42" rx="6" fill="#ffffff" stroke="#cfd6de"/>
<path d="M300,132 C316,122 332,144 348,130" fill="none" stroke="#7d8a98" stroke-width="1.6"/>
<path d="M300,132 C316,122 332,144 348,130" fill="none" stroke="#7d8a98" stroke-width="1.6" transform="translate(0,7)"/>
<path d="M348,130 C360,124 366,120 372,114" fill="none" stroke="#7d8a98" stroke-width="1.5"/>
<circle cx="372" cy="114" r="2" fill="#7d8a98"/>
<text x="322" y="166" text-anchor="middle" font-size="9.5" fill="#33404f">1 min 内变清变黏</text>
<text x="322" y="179" text-anchor="middle" font-size="9.5" fill="#2f7a45">挑起拉丝：霍乱弧菌＋</text>
<!-- 阴性：不拉丝 -->
<text x="322" y="196" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c2413d">阴性（−）</text>
<rect x="284" y="202" width="76" height="40" rx="6" fill="#ffffff" stroke="#cfd6de"/>
<path d="M300,220 C316,212 332,228 348,216" fill="none" stroke="#b9c2cc" stroke-width="1.4"/>
<circle cx="336" cy="223" r="3" fill="#8c96a2" stroke="#6b7684" stroke-width="0.8"/>
<circle cx="312" cy="228" r="2.4" fill="#8c96a2" stroke="#6b7684" stroke-width="0.8"/>
<text x="322" y="254" text-anchor="middle" font-size="9.5" fill="#33404f">仍混浊、环上无丝</text>
<text x="322" y="267" text-anchor="middle" font-size="9.5" fill="#c2413d">气单胞菌−（与 O/129 耐药互证）</text>
<!-- 提示 -->
<text x="382" y="120" font-size="9.5" fill="#5c6672">悬液由混</text>
<line x1="382" y1="124" x2="382" y2="132" stroke="#5c6672" stroke-width="1.1" marker-end="url(#ar)"/>
<text x="382" y="144" font-size="9.5" fill="#5c6672">变清变黏</text>

<!-- 页脚 -->
<rect x="24" y="276" width="432" height="34" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="32" y="290" font-size="9.5" fill="#5c6672"><tspan font-weight="700" fill="#33404f">组合判读</tspan>　霍乱弧菌：O/129 敏感 ＋ 黏丝＋　·　气单胞菌：O/129 耐药 ＋ 黏丝−</text>
<text x="32" y="304" font-size="9.5" fill="#5c6672">邻单胞菌：O/129 敏感 ＋ 黏丝−（部分）　·　副溶血性弧菌：150 μg 敏感 / 10 μg 耐药</text>
</svg>
