<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>胞内生存（进入 · 存活 · 扩散）</title>
<desc>胞内菌三步：①进入——李斯特菌内化素 InlA/InlB 结合上皮钙黏蛋白主动侵入（母婴/血脑屏障传播基础），志贺菌 IpaB/IpaC 侵袭蛋白跨细胞扩散；②存活——结核阻断吞噬体-溶酶体融合（肉芽肿隔离），军团菌 Dot/Icm 改造吞噬体为复制巢，布鲁氏菌/柯克斯体耐酸；③扩散——李斯特菌溶血素 O 逃逸入胞浆，肌动蛋白「弹弓」细胞间直接传播避开体液免疫；治疗需胞内活性药物（利福平/氟喹诺酮/大环内酯）</desc>
<defs>
  <radialGradient id="cellm" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#fdf6ea"/><stop offset="1" stop-color="#ecd6a8"/></radialGradient>
  <radialGradient id="intrab" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#fbeaea"/><stop offset="1" stop-color="#dfa0a0"/></radialGradient>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="360" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">胞内生存：进入 · 存活 · 扩散</text>
<rect x="356" y="14" width="100" height="18" rx="9" fill="#eef1f5"/>
<text x="406" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">致病因素 · 胞内菌</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">把宿主细胞从猎手改造成庇护所——抗体与多数抗生素都够不着</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== ① 进入 ===== -->
<circle cx="40" cy="78" r="8" fill="#1f2733"/><text x="40" y="82" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">1</text>
<text x="56" y="82" font-size="11" font-weight="700" fill="#33404f">进入：主动敲开非吞噬细胞</text>
<!-- 上皮细胞 -->
<rect x="34" y="128" width="190" height="52" rx="8" fill="url(#cellm)" stroke="#d9b96a" stroke-width="1.3"/>
<text x="129" y="172" text-anchor="middle" font-size="9.5" fill="#8a6d2f">肠道上皮细胞</text>
<!-- InlA 钥匙 -->
<rect x="80" y="100" width="26" height="12" rx="6" fill="url(#intrab)" stroke="#a85a5a" stroke-width="1.3"/>
<line x1="93" y1="112" x2="93" y2="128" stroke="#a85a5a" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="112" y="110" font-size="9.5" fill="#a3332f">李斯特菌 InlA/InlB</text>
<text x="112" y="122" font-size="9.5" fill="#5c6672">↓ 结合上皮钙黏蛋白</text>
<text x="56" y="196" font-size="9.5" fill="#33404f">志贺菌 IpaB/IpaC 侵袭蛋白同理</text>
<text x="56" y="209" font-size="9.5" fill="#5c6672">EPEC 确认查 eae 基因（intimin）</text>

<!-- ===== ② 存活（吞噬体内各显神通） ===== -->
<circle cx="272" cy="78" r="8" fill="#1f2733"/><text x="272" y="82" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">2</text>
<text x="288" y="82" font-size="11" font-weight="700" fill="#33404f">存活：吞噬体里的三种活法</text>
<!-- 结核：阻断融合 -->
<circle cx="330" cy="118" r="15" fill="none" stroke="#9fb7d0" stroke-width="1.4"/>
<rect x="322" y="112" width="16" height="10" rx="5" fill="url(#intrab)" stroke="#a85a5a" stroke-width="1.1"/>
<path d="M346,110 l6,6 m0,-6 l-6,6" stroke="#c2413d" stroke-width="1.6"/>
<text x="356" y="106" font-size="9.5" fill="#c2413d">阻断融合</text>
<text x="272" y="144" font-size="9.5" fill="#33404f">结核：阻断与溶酶体融合</text>
<!-- 军团菌：改造 -->
<circle cx="420" cy="118" r="15" fill="none" stroke="#c9a95f" stroke-width="1.4" stroke-dasharray="3 2"/>
<rect x="412" y="112" width="16" height="10" rx="5" fill="url(#intrab)" stroke="#a85a5a" stroke-width="1.1"/>
<text x="420" y="144" text-anchor="middle" font-size="9.5" fill="#33404f">军团菌：改造复制巢</text>
<text x="300" y="160" font-size="9.5" fill="#5c6672">布鲁氏菌/柯克斯体：耐酸硬扛</text>
<text x="300" y="173" font-size="9.5" fill="#5c6672">肉芽肿＝隔离双刃剑</text>

<!-- ===== ③ 扩散：弹弓 ===== -->
<circle cx="40" cy="238" r="8" fill="#1f2733"/><text x="40" y="242" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">3</text>
<text x="56" y="242" font-size="11" font-weight="700" fill="#33404f">扩散：肌动蛋白弹弓过墙</text>
<!-- 两个相邻细胞 + 弹弓 -->
<rect x="34" y="258" width="100" height="46" rx="8" fill="url(#cellm)" stroke="#d9b96a"/>
<rect x="140" y="258" width="100" height="46" rx="8" fill="url(#cellm)" stroke="#d9b96a"/>
<!-- 李斯特菌带彗尾 -->
<rect x="96" y="276" width="14" height="8" rx="4" fill="url(#intrab)" stroke="#a85a5a" stroke-width="1.2"/>
<path d="M96,280 l-14,-6 M96,280 l-14,2 M96,280 l-14,9" stroke="#c9a95f" stroke-width="1.6" stroke-linecap="round"/>
<line x1="110" y1="280" x2="136" y2="280" stroke="#a85a5a" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="60" y="256" font-size="9.5" fill="#8a6d2f">溶血素 O 破膜入胞浆</text>
<text x="150" y="256" font-size="9.5" fill="#8a6d2f">顶入邻细胞（不接触体液）</text>
<text x="260" y="276" font-size="9.5" fill="#33404f">抗体、补体、多数抗生素</text>
<text x="260" y="289" font-size="9.5" fill="#33404f">全程够不着——细胞免疫才是关键</text>

<!-- 页脚 -->
<rect x="24" y="314" width="432" height="32" rx="6" fill="#fdf6f5" stroke="#e3c8c8"/>
<text x="32" y="328" font-size="9.5" fill="#5c6672"><tspan font-weight="700" fill="#a3332f">治疗</tspan>　须用胞内活性药：利福平/氟喹诺酮/大环内酯/四环素；长疗程防复发</text>
<text x="32" y="341" font-size="9.5" fill="#5c6672">（布病 6 周联合、结核 6 个月）；HIV 患者胞内菌感染加重＝Th1 缺陷证据</text>
</svg>
