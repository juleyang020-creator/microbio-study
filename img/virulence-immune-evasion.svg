<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 372" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>免疫逃逸的四种打法（变脸 · 抗补体 · 切抗体 · 杀白细胞）</title>
<desc>抗原变异：淋病奈瑟菌菌毛/Opa 基因转换、流感抗原漂移与转换、回归热 Vmp 切换——感染后不免疫；补体抵抗：脑膜炎奈瑟菌 fHbp 结合 H 因子下调替代途径，逃过 MAC 膜攻击（晚期补体缺陷与依库珠单抗用药者 IMD 高危）；IgA 蛋白酶：奈瑟菌/流感嗜血杆菌/肺炎链球菌裂解 slgA 铰链区，黏膜长期定植；PVL 杀白细胞素：金葡打孔毒素溶解中性粒细胞与巨噬细胞，CA-MRSA 相关坏死性肺炎</desc>
<defs>
  <radialGradient id="bac" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#efe9f8"/><stop offset="1" stop-color="#c9b8e2"/></radialGradient>
  <radialGradient id="immune" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#eef4fb"/><stop offset="1" stop-color="#b9cde4"/></radialGradient>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="372" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">免疫逃逸的四种打法</text>
<rect x="356" y="14" width="100" height="18" rx="9" fill="#eef1f5"/>
<text x="406" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">致病因素 · 免疫逃逸</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">不变脸的挡抗体，会耍赖的拆补体——免疫系统每一层都有对应破解</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== ① 抗原变异：变脸 ===== -->
<circle cx="40" cy="78" r="8" fill="#1f2733"/><text x="40" y="82" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">1</text>
<text x="56" y="82" font-size="11" font-weight="700" fill="#33404f">抗原变异：高频率换脸</text>
<!-- 两张脸 -->
<circle cx="78" cy="116" r="16" fill="url(#bac)" stroke="#7a63ad" stroke-width="1.4"/>
<g fill="#7a63ad"><circle cx="72" cy="112" r="2"/><circle cx="84" cy="112" r="2"/><circle cx="72" cy="120" r="2"/><circle cx="84" cy="120" r="2"/></g>
<line x1="100" y1="116" x2="122" y2="116" stroke="#33404f" stroke-width="1.3" marker-end="url(#arr)"/>
<circle cx="146" cy="116" r="16" fill="url(#bac)" stroke="#c2413d" stroke-width="1.4"/>
<g fill="#c2413d"><circle cx="140" cy="110" r="2"/><circle cx="152" cy="110" r="2"/><circle cx="146" cy="118" r="2"/><circle cx="140" cy="122" r="2"/><circle cx="152" cy="122" r="2"/></g>
<!-- 旧抗体认不出 -->
<path d="M186,108 l7,7 m0,-7 l-7,7" stroke="#c2413d" stroke-width="1.8"/>
<text x="200" y="113" font-size="9.5" fill="#5c6672">已有抗体失效</text>
<text x="70" y="146" font-size="9.5" fill="#33404f">淋球菌菌毛/Opa 基因转换</text>
<text x="70" y="159" font-size="9.5" fill="#33404f">流感漂移（点突变）/ 转换（重排）</text>
<text x="70" y="172" font-size="9.5" fill="#5c6672">回归热 Vmp · 链球菌 M 蛋白 200+ 型</text>

<!-- ===== ② 补体抵抗 ===== -->
<circle cx="268" cy="78" r="8" fill="#1f2733"/><text x="268" y="82" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">2</text>
<text x="284" y="82" font-size="11" font-weight="700" fill="#33404f">补体抵抗：拆掉 MAC</text>
<!-- MAC 攻击被 fHbp 拦下 -->
<circle cx="330" cy="120" r="17" fill="url(#bac)" stroke="#7a63ad" stroke-width="1.4"/>
<text x="330" y="124" text-anchor="middle" font-size="9.5" fill="#5b4f8a">奈瑟菌</text>
<!-- fHbp 罩 -->
<path d="M313,120 a17,17 0 0,1 34,0" fill="none" stroke="#2b6cb0" stroke-width="2.4"/>
<text x="330" y="100" text-anchor="middle" font-size="9.5" fill="#2b6cb0">fHbp 结合 H 因子</text>
<!-- C5b-9 MAC 被挡 -->
<g fill="#6b7684"><circle cx="372" cy="106" r="3.4"/><circle cx="380" cy="116" r="3.4"/><circle cx="374" cy="126" r="3.4"/></g>
<text x="394" y="118" font-size="9.5" fill="#5c6672">C5b-9（MAC）</text>
<line x1="368" y1="120" x2="348" y2="120" stroke="#c2413d" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="358" y="134" text-anchor="middle" font-size="9.5" fill="#c2413d">被挡</text>
<text x="300" y="150" font-size="9.5" fill="#33404f">脑膜炎奈瑟菌（流脑疫苗靶 fHbp）</text>
<text x="300" y="163" font-size="9.5" fill="#a3332f">晚期补体缺陷 / 依库珠单抗 → IMD 高危</text>
<text x="300" y="176" font-size="9.5" fill="#5c6672">SBA 血清杀菌试验评估疫苗保护</text>

<!-- ===== ③ IgA 蛋白酶 ===== -->
<circle cx="40" cy="206" r="8" fill="#1f2733"/><text x="40" y="210" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">3</text>
<text x="56" y="210" font-size="11" font-weight="700" fill="#33404f">IgA 蛋白酶：剪断黏膜抗体</text>
<!-- slgA 被剪 -->
<path d="M76,238 l10,-12 l10,12 l10,-12 l10,12" fill="none" stroke="#2b6cb0" stroke-width="2"/>
<text x="130" y="240" font-size="9.5" fill="#2b6cb0">slgA（黏膜一线）</text>
<line x1="96" y1="248" x2="96" y2="260" stroke="#c2413d" stroke-width="1.8"/>
<text x="106" y="260" font-size="9.5" fill="#c2413d">铰链区裂解 ✂</text>
<text x="70" y="278" font-size="9.5" fill="#33404f">淋病/脑膜炎奈瑟菌 · 流感嗜血杆菌</text>
<text x="70" y="291" font-size="9.5" fill="#33404f">肺炎链球菌 · 脲原体</text>
<text x="70" y="304" font-size="9.5" fill="#5c6672">→ 黏膜长期定植、局部抗体清不掉</text>

<!-- ===== ④ PVL 杀白细胞素 ===== -->
<circle cx="268" cy="206" r="8" fill="#1f2733"/><text x="268" y="210" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">4</text>
<text x="284" y="210" font-size="11" font-weight="700" fill="#33404f">PVL：给白细胞打孔</text>
<!-- 金葡释放 PVL，中性粒细胞溶解 -->
<circle cx="316" cy="246" r="13" fill="url(#bac)" stroke="#7a63ad" stroke-width="1.4"/>
<text x="316" y="250" text-anchor="middle" font-size="9.5" fill="#5b4f8a">金葡</text>
<g stroke="#c2413d" stroke-width="1.3" marker-end="url(#arr)">
  <line x1="330" y1="246" x2="356" y2="246"/>
</g>
<text x="343" y="238" text-anchor="middle" font-size="9.5" fill="#c2413d">PVL</text>
<!-- 中性粒细胞（多叶核）破洞溶解 -->
<circle cx="382" cy="246" r="16" fill="url(#immune)" stroke="#5b7d9d" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="382" cy="246" r="6" fill="none" stroke="#5b7d9d" stroke-width="1.2"/>
<path d="M376,240 l4,4 m10,8 l4,4" stroke="#c2413d" stroke-width="1.6"/>
<text x="382" y="276" text-anchor="middle" font-size="9.5" fill="#5c6672">中性粒/巨噬细胞溶解</text>
<text x="300" y="296" font-size="9.5" fill="#33404f">CA-MRSA 常携带（前噬菌体 lukS/F-PV）</text>
<text x="300" y="309" font-size="9.5" fill="#a3332f">流感后坏死性肺炎可致命</text>

<!-- 页脚 -->
<rect x="24" y="330" width="432" height="30" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="32" y="349" font-size="9.5" fill="#5c6672"><tspan font-weight="700" fill="#33404f">意义</tspan>　淋病/链咽炎可反复感染（无保护免疫）· 反复奈瑟菌感染查 C5-C9 · PVL 基因检测试剂盒可单项确认</text>
</svg>
