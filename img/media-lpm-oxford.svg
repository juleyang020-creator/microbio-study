<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>LPM / Oxford 琼脂（李斯特菌黑色菌落）</title>
<desc>LPM（McBride）含氯化锂+苯乙醇+拉氧头孢抑制杂菌；Oxford 再加七叶苷与柠檬酸铁铵：李斯特菌水解七叶苷，产物与铁离子反应使菌落及周围呈黑色。用于从食品、环境等含大量菌群的标本中分离李斯特菌；金黄色葡萄球菌与粪肠球菌被完全抑制</desc>
<defs>
  <radialGradient id="oxagar" cx="42%" cy="36%" r="72%"><stop offset="0" stop-color="#f3ead9"/><stop offset="1" stop-color="#dcc9a4"/></radialGradient>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="330" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">LPM / Oxford 琼脂</text>
<rect x="356" y="14" width="100" height="18" rx="9" fill="#eef1f5"/>
<text x="406" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">选择与鉴别培养基</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">锂+抗生素挡住杂菌，七叶苷-铁给李斯特菌染上黑色</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 左：平板俯视 ===== -->
<text x="24" y="80" font-size="9.5" fill="#5c6672">Oxford 平板 · 35℃ 48 h</text>
<circle cx="120" cy="170" r="72" fill="#f0f2f4" stroke="#cdd4db" stroke-width="1.4"/>
<circle cx="120" cy="170" r="68" fill="url(#oxagar)"/>
<!-- 李斯特菌：小黑点 + 周围晕黑 -->
<circle cx="100" cy="150" r="11" fill="#3a3630" opacity="0.55"/>
<circle cx="100" cy="150" r="3.2" fill="#1c1a17"/>
<circle cx="98" cy="128" r="6.6" fill="#1f2733"/>
<text x="98" y="131.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">1</text>
<circle cx="146" cy="182" r="9" fill="#3a3630" opacity="0.5"/>
<circle cx="146" cy="182" r="2.6" fill="#1c1a17"/>
<circle cx="120" cy="204" r="7" fill="#3a3630" opacity="0.45"/>
<circle cx="120" cy="204" r="2.2" fill="#1c1a17"/>
<!-- 杂菌被抑制 -->
<g fill="none" stroke="#c9b28a" stroke-width="1.1" stroke-dasharray="3,2.5">
  <circle cx="170" cy="140" r="6"/><circle cx="76" cy="196" r="5"/>
</g>
<path d="M167,137 l6,6 m0,-6 l-6,6 M73,193 l6,6 m0,-6 l-6,6" stroke="#c9a95f" stroke-width="1.2"/>
<text x="120" y="252" text-anchor="middle" font-size="9.5" fill="#5c6672">黑色菌落＋周围晕黑（七叶苷-铁反应）</text>

<!-- ===== 右：机制 ===== -->
<text x="232" y="80" font-size="10.5" font-weight="700" fill="#33404f">选择靠锂与抗生素，鉴别靠七叶苷</text>
<g font-size="9.5">
  <rect x="232" y="92" width="224" height="40" rx="7" fill="#f5f7f9" stroke="#e3e7ec"/>
  <text x="242" y="108" font-weight="700" fill="#33404f">① LPM 基础：LiCl＋苯乙醇＋拉氧头孢</text>
  <text x="242" y="122" fill="#5c6672">从食品/环境的高背景菌群中筛出李斯特菌</text>

  <rect x="232" y="140" width="224" height="40" rx="7" fill="#fdf6f0" stroke="#e3c8b8"/>
  <text x="242" y="156" font-weight="700" fill="#33404f">② Oxford 加七叶苷＋柠檬酸铁铵</text>
  <text x="242" y="170" fill="#5c6672">李斯特菌水解七叶苷 → 与 Fe³⁺ 反应呈黑色</text>

  <rect x="232" y="188" width="224" height="40" rx="7" fill="#f0f6f2" stroke="#c8dcc5"/>
  <text x="242" y="204" font-weight="700" fill="#2f6b45">③ 质控（48 h）</text>
  <text x="242" y="218" fill="#5c6672">产单核李斯特 ATCC 19114：黑色菌落生长良好</text>
</g>
<rect x="232" y="238" width="224" height="40" rx="7" fill="#f0f6f2" stroke="#c8dcc5"/>
<text x="242" y="254" font-size="9.5" fill="#33404f">金黄色葡萄球菌 ATCC 25923：完全抑制</text>
<text x="242" y="268" font-size="9.5" fill="#33404f">粪肠球菌 ATCC 29212：完全抑制</text>

<!-- 结论 -->
<text x="240" y="292" text-anchor="middle" font-size="11.5" fill="#33404f">黑色是七叶苷水解的信号，不是菌落本身的颜色</text>

<!-- 页脚 -->
<rect x="24" y="300" width="432" height="24" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="32" y="316" font-size="9.5" fill="#5c6672"><tspan font-weight="700" fill="#33404f">用途</tspan>　食品/环境标本李斯特菌分离；疑似菌落再经动力（25℃ 伞状）与溶血确认</text>
</svg>
