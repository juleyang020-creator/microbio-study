<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>抗丙肝病毒药（直接抗病毒药 DAA 的三类靶点）</title><desc>NS3/4A 蛋白酶抑制剂阻断多聚蛋白切割、NS5A 抑制剂干扰复制与组装、NS5B 聚合酶抑制剂终止 RNA 合成；核苷类 NS5B 抑制剂耐药屏障最高</desc>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
  <marker id="blk" markerWidth="8" markerHeight="12" refX="6" refY="6" orient="auto"><line x1="6" y1="1" x2="6" y2="11" stroke="#c2413d" stroke-width="2.4"/></marker>
</defs>
<rect width="480" height="300" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">抗丙肝病毒药（DAA）</text>
<rect x="366" y="14" width="90" height="18" rx="9" fill="#eef2f7"/>
<text x="411" y="27" text-anchor="middle" font-size="10" fill="#5c6672">抗病毒机制 5/5</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">直接抗病毒药按三个非结构蛋白靶点分类，均以固定复方使用</text>
<line x1="24" y1="56" x2="456" y2="56" stroke="#e3e7ec"/>

<!-- HCV 多聚蛋白 -->
<rect x="30" y="72" width="420" height="24" rx="4" fill="#eef1f8" stroke="#7b8ba0" stroke-width="0.9"/>
<text x="240" y="88" text-anchor="middle" font-size="10" fill="#4a5768">HCV 单一多聚蛋白前体（core｜E1｜E2｜NS2｜NS3｜NS4A｜NS4B｜NS5A｜NS5B）</text>
<line x1="240" y1="96" x2="240" y2="112" stroke="#33404f" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- 三个靶点 -->
<rect x="30" y="118" width="132" height="58" rx="6" fill="#f7f9fb" stroke="#d6dee8" stroke-width="0.8"/>
<text x="96" y="134" text-anchor="middle" font-size="10" font-weight="700" fill="#1f4e79">① NS3/4A 蛋白酶</text>
<text x="96" y="149" text-anchor="middle" font-size="9.5" fill="#5c6672">切割多聚蛋白</text>
<rect x="42" y="155" width="108" height="15" rx="7.5" fill="#f9e6e4" stroke="#c2413d"/>
<text x="96" y="166" text-anchor="middle" font-size="9.5" fill="#a3332f">格卡瑞韦（-previr）</text>

<rect x="174" y="118" width="132" height="58" rx="6" fill="#f7f9fb" stroke="#d6dee8" stroke-width="0.8"/>
<text x="240" y="134" text-anchor="middle" font-size="10" font-weight="700" fill="#1f4e79">② NS5A</text>
<text x="240" y="149" text-anchor="middle" font-size="9.5" fill="#5c6672">复制与组装所必需</text>
<rect x="186" y="155" width="108" height="15" rx="7.5" fill="#f9e6e4" stroke="#c2413d"/>
<text x="240" y="166" text-anchor="middle" font-size="9.5" fill="#a3332f">维帕他韦（-asvir）</text>

<rect x="318" y="118" width="132" height="58" rx="6" fill="#f7f9fb" stroke="#d6dee8" stroke-width="0.8"/>
<text x="384" y="134" text-anchor="middle" font-size="10" font-weight="700" fill="#1f4e79">③ NS5B 聚合酶</text>
<text x="384" y="149" text-anchor="middle" font-size="9.5" fill="#5c6672">RNA 依赖的 RNA 聚合酶</text>
<rect x="330" y="155" width="108" height="15" rx="7.5" fill="#f9e6e4" stroke="#c2413d"/>
<text x="384" y="166" text-anchor="middle" font-size="9.5" fill="#a3332f">索非布韦（-buvir）</text>

<!-- 耐药屏障 -->
<rect x="30" y="186" width="420" height="44" rx="6" fill="#eef5f0" stroke="#b7d3c3" stroke-width="0.8"/>
<text x="40" y="202" font-size="9.5" font-weight="700" fill="#2f6b4f">耐药屏障差异（决定为何都做成固定复方）</text>
<text x="40" y="216" font-size="9.5" fill="#43705c">NS5B 核苷类似物：结构高度保守、覆盖 6 种基因型且不易耐药 —— 屏障最高</text>
<text x="40" y="227" font-size="9.5" fill="#43705c">NS5A 抑制剂：对所有基因型有效，但阻碍耐药的能力弱 —— 故不单用</text>

<!-- 警示 -->
<text x="240" y="248" text-anchor="middle" font-size="10" fill="#a3332f">⚠️ 所有 DAA 均警示：合并 HBV 感染者可发生 HBV 再激活致暴发性肝炎，用药前须筛查 HBV</text>

<!-- 页脚 -->
<rect x="24" y="258" width="432" height="34" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="32" y="272" font-size="10" fill="#5c6672"><tspan font-weight="700" fill="#1f2733">代表药</tspan>　索非布韦｜来迪派韦｜维帕他韦｜格卡瑞韦｜哌仑他韦</text>
<text x="32" y="285" font-size="9.5" fill="#93a0ad">利巴韦林机制不清楚、不属三类靶点，仅与 DAA 联合使用</text>
</svg>
