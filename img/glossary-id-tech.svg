<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 364" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>鉴定技术与生物安全缩写（MALDI · 16S · PCR/NAAT · ELISA · BSL）</title>
<desc>MALDI-TOF MS：蛋白指纹比对谱库，分钟级定种（血培养报阳后快速鉴定的主力）；16S rRNA 测序：高保守区通用引物＋高变区鉴别，谱库未收录菌的兜底金标准；PCR/NAAT：靶向核酸扩增（结核 Xpert、难辨梭菌毒素基因、耐甲氧西林 mecA），快但只检出靶标；ELISA/EIA：酶标抗原抗体检测（HBsAg、HIV 筛查）；BSL 生物安全水平 1~4 级：结核培养/疑似布鲁菌/双相真菌霉菌型须 BSL-3</desc>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="364" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">鉴定技术与生物安全</text>
<rect x="396" y="14" width="60" height="18" rx="9" fill="#eef1f5"/>
<text x="426" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">术语</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">快有快的赛道，准有准的兜底——生物安全是共同底线</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 速度轴：四种技术 ===== -->
<line x1="40" y1="86" x2="440" y2="86" stroke="#33404f" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="440" y="76" text-anchor="end" font-size="9.5" fill="#5c6672">出结果时间 →</text>

<!-- MALDI -->
<circle cx="90" cy="86" r="5" fill="#2f8f83"/>
<rect x="40" y="98" width="110" height="66" rx="7" fill="#e6f4f1" stroke="#bfe3dc"/>
<text x="50" y="114" font-size="9.5" font-weight="700" fill="#2f6b45">MALDI-TOF MS</text>
<text x="50" y="127" font-size="9.5" fill="#33404f">分钟级 · 蛋白指纹</text>
<text x="50" y="140" font-size="9.5" fill="#5c6672">血培养报阳后快速定种</text>
<text x="50" y="153" font-size="9.5" fill="#5c6672">靠谱库覆盖度</text>

<!-- PCR/NAAT -->
<circle cx="200" cy="86" r="5" fill="#2b6cb0"/>
<rect x="155" y="98" width="100" height="66" rx="7" fill="#eef4fb" stroke="#b9cde4"/>
<text x="165" y="114" font-size="9.5" font-weight="700" fill="#1f4e79">PCR / NAAT</text>
<text x="165" y="127" font-size="9.5" fill="#33404f">小时级 · 核酸靶标</text>
<text x="165" y="140" font-size="9.5" fill="#5c6672">Xpert 结核 · 难辨梭菌</text>
<text x="165" y="153" font-size="9.5" fill="#5c6672">mecA · 只检出靶标</text>

<!-- 16S -->
<circle cx="305" cy="86" r="5" fill="#6e5a9e"/>
<rect x="262" y="98" width="96" height="66" rx="7" fill="#f5f0fa" stroke="#b9a5d9"/>
<text x="272" y="114" font-size="9.5" font-weight="700" fill="#5b4f8a">16S rRNA 测序</text>
<text x="272" y="127" font-size="9.5" fill="#33404f">天级 · 通用引物</text>
<text x="272" y="140" font-size="9.5" fill="#5c6672">谱库未收录菌兜底</text>
<text x="272" y="153" font-size="9.5" fill="#5c6672">分类学金标准</text>

<!-- ELISA -->
<circle cx="405" cy="86" r="5" fill="#c9a95f"/>
<rect x="366" y="98" width="90" height="66" rx="7" fill="#fdf6e3" stroke="#c9a95f"/>
<text x="376" y="114" font-size="9.5" font-weight="700" fill="#8a6d2f">ELISA / EIA</text>
<text x="376" y="127" font-size="9.5" fill="#33404f">抗原/抗体检测</text>
<text x="376" y="140" font-size="9.5" fill="#5c6672">HBsAg · HIV 筛查</text>
<text x="376" y="153" font-size="9.5" fill="#5c6672">适合批量筛查</text>

<!-- 选用逻辑 -->
<rect x="24" y="180" width="432" height="56" rx="8" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="36" y="198" font-size="10" font-weight="700" fill="#1f2733">怎么选</text>
<text x="36" y="214" font-size="9.5" fill="#33404f">要快：MALDI（纯培养/血培养）→ 要确认耐药基因：PCR/NAAT → 定不了种：16S 测序</text>
<text x="36" y="228" font-size="9.5" fill="#5c6672">ELISA 管血清学（抗原/抗体），不管病原培养鉴定；NAAT 阳性≠活菌（死菌核酸也阳）</text>

<!-- ===== BSL 分级 ===== -->
<text x="24" y="262" font-size="10.5" font-weight="700" fill="#33404f">BSL（生物安全水平）：按病原风险分级操作</text>
<g font-size="9.5">
  <rect x="24" y="274" width="104" height="52" rx="7" fill="#f0f6f2" stroke="#c8dcc5"/>
  <text x="34" y="290" font-weight="700" fill="#2f6b45">BSL-1 / 2</text>
  <text x="34" y="304" fill="#33404f">常规临床微生物</text>
  <text x="34" y="317" fill="#5c6672">大肠/金葡等（二级为主）</text>
  <rect x="136" y="274" width="160" height="52" rx="7" fill="#fdf6e3" stroke="#c9a95f"/>
  <text x="146" y="290" font-weight="700" fill="#8a6d2f">BSL-3</text>
  <text x="146" y="304" fill="#33404f">结核分枝杆菌培养 · 疑似布鲁菌</text>
  <text x="146" y="317" fill="#5c6672">双相真菌霉菌型（球孢子菌等）</text>
  <rect x="304" y="274" width="152" height="52" rx="7" fill="#fdf0ef" stroke="#dfa0a0"/>
  <text x="314" y="290" font-weight="700" fill="#a3332f">BSL-4</text>
  <text x="314" y="304" fill="#33404f">高致病性病毒（埃博拉等）</text>
  <text x="314" y="317" fill="#5c6672">常规医院实验室不涉及</text>
</g>

<!-- 页脚 -->
<text x="240" y="350" text-anchor="middle" font-size="9.5" fill="#a3332f">涂片染色等开放操作在二级生物安全柜内进行；气溶胶风险操作一律上柜</text>
</svg>
