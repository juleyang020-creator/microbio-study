<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>真菌与病毒结构总览（菌丝 · 孢子 · 衣壳 · 包膜）</title>
<desc>真菌：假菌丝（白念珠菌芽殖链状缢窄）、有隔/无隔菌丝（门级分类轴）、大/小分生孢子（曲霉顶囊/镰刀）、厚壁孢子（白念顶端）、孢子囊孢子（毛霉）；病毒：裸病毒=衣壳+核酸（二十面体/螺旋对称），包膜病毒出芽获得脂蛋白膜与刺突——包膜病毒对脂溶剂敏感、裸病毒需高水平消毒</desc>
<rect width="480" height="330" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">真菌与病毒结构总览</text>
<rect x="396" y="14" width="60" height="18" rx="9" fill="#eef1f5"/>
<text x="426" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">术语</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">丝与孢子认真菌，衣壳与包膜认病毒</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e7e4dd"/>

<!-- ===== 左上：菌丝类 ===== -->
<rect x="24" y="66" width="216" height="120" rx="8" fill="#fbf6ec" stroke="#e6d9b8"/>
<text x="34" y="84" font-size="10.5" font-weight="700" fill="#8a6d1a">菌丝类</text>
<!-- 假菌丝：芽殖链缢窄 -->
<text x="36" y="100" font-size="9.5" fill="#33404f">假菌丝（缢窄连接）</text>
<g fill="#e8d9b8" stroke="#a8894e" stroke-width="1">
  <ellipse cx="52" cy="112" rx="8" ry="5.5"/>
  <ellipse cx="66" cy="116" rx="8" ry="5.5"/>
  <ellipse cx="80" cy="112" rx="8" ry="5.5"/>
  <ellipse cx="94" cy="116" rx="8" ry="5.5"/>
</g>
<text x="120" y="119" font-size="9.5" fill="#5c6672">白念珠菌</text>
<!-- 有隔菌丝 -->
<text x="36" y="140" font-size="9.5" fill="#33404f">有隔菌丝</text>
<path d="M36,152 L130,152" stroke="#a8894e" stroke-width="3"/>
<g stroke="#5d4a26" stroke-width="1">
  <line x1="52" y1="146" x2="52" y2="158"/><line x1="72" y1="146" x2="72" y2="158"/><line x1="92" y1="146" x2="92" y2="158"/><line x1="112" y1="146" x2="112" y2="158"/>
</g>
<text x="140" y="156" font-size="9.5" fill="#5c6672">隔膜（门级分类轴）</text>
<!-- 无隔 -->
<text x="36" y="176" font-size="9.5" fill="#33404f">无隔菌丝</text>
<path d="M36,170 L130,170" stroke="#a8894e" stroke-width="3" transform="translate(0,8)"/>
<text x="140" y="182" font-size="9.5" fill="#5c6672">毛霉目（多核）</text>

<!-- ===== 右上：孢子类 ===== -->
<rect x="248" y="66" width="208" height="120" rx="8" fill="#fbf6ec" stroke="#e6d9b8"/>
<text x="258" y="84" font-size="10.5" font-weight="700" fill="#8a6d1a">孢子类</text>
<!-- 大分生孢子（梭形） -->
<text x="258" y="100" font-size="9.5" fill="#33404f">大分生孢子（梭形）</text>
<ellipse cx="300" cy="112" rx="16" ry="6" fill="#e8d9b8" stroke="#a8894e" stroke-width="1"/>
<path d="M290,112 h20 M300,106 v12" stroke="#5d4a26" stroke-width="0.8"/>
<text x="324" y="116" font-size="9.5" fill="#5c6672">曲霉/镰刀</text>
<!-- 小分生孢子（链状） -->
<text x="258" y="138" font-size="9.5" fill="#33404f">小分生孢子</text>
<circle cx="270" cy="150" r="3.5" fill="#e8d9b8" stroke="#a8894e" stroke-width="1"/>
<circle cx="278" cy="150" r="3.5" fill="#e8d9b8" stroke="#a8894e" stroke-width="1"/>
<circle cx="286" cy="150" r="3.5" fill="#e8d9b8" stroke="#a8894e" stroke-width="1"/>
<text x="298" y="154" font-size="9.5" fill="#5c6672">链状/假头状着生</text>
<!-- 厚壁孢子 -->
<text x="382" y="138" font-size="9.5" fill="#33404f">厚壁孢子</text>
<circle cx="398" cy="150" r="7" fill="#d9c9a4" stroke="#8a6d1a" stroke-width="1.4"/>
<circle cx="398" cy="150" r="3.5" fill="#b39755"/>
<text x="412" y="154" font-size="9.5" fill="#5c6672">白念顶端</text>
<!-- 孢子囊孢子 -->
<text x="258" y="176" font-size="9.5" fill="#33404f">孢子囊孢子（囊内内生）</text>
<circle cx="346" cy="172" r="8" fill="#f2ecdd" stroke="#a8894e" stroke-width="1.2"/>
<circle cx="343" cy="172" r="2" fill="#5d4a26"/><circle cx="349" cy="170" r="2" fill="#5d4a26"/><circle cx="347" cy="175" r="2" fill="#5d4a26"/>
<text x="362" y="176" font-size="9.5" fill="#5c6672">毛霉目</text>

<!-- ===== 下：病毒 ===== -->
<rect x="24" y="196" width="216" height="100" rx="8" fill="#eef2f7" stroke="#d3dbe6"/>
<text x="34" y="214" font-size="10.5" font-weight="700" fill="#33404f">裸病毒＝衣壳＋核酸</text>
<!-- 二十面体 -->
<g transform="translate(66,246)">
  <polygon points="0,-20 19,-6 12,17 -12,17 -19,-6" fill="#cdd8e6" stroke="#6b7684" stroke-width="1.2"/>
  <polygon points="0,-20 19,-6 0,4" fill="#a9bacd"/>
  <polygon points="0,-20 -19,-6 0,4" fill="#c2cfdd"/>
</g>
<text x="66" y="284" text-anchor="middle" font-size="9.5" fill="#5c6672">二十面体（腺病毒）</text>
<!-- 螺旋 -->
<g transform="translate(160,246)">
  <path d="M-24,14 q6,-24 12,0 q6,24 12,0 q6,-24 12,0" fill="none" stroke="#6b7684" stroke-width="2"/>
</g>
<text x="160" y="284" text-anchor="middle" font-size="9.5" fill="#5c6672">螺旋对称（流感核衣壳）</text>

<!-- 包膜病毒 -->
<rect x="248" y="196" width="208" height="100" rx="8" fill="#fdf0f0" stroke="#e8c9c9"/>
<text x="258" y="214" font-size="10.5" font-weight="700" fill="#8f3b3b">包膜病毒＝核衣壳＋脂蛋白膜</text>
<!-- 出芽示意 -->
<circle cx="300" cy="258" r="17" fill="#f5d9d9" stroke="#c17a7a" stroke-width="1.4"/>
<circle cx="300" cy="258" r="8" fill="#c17a7a"/>
<!-- 刺突 -->
<g stroke="#8f3b3b" stroke-width="1.6">
  <line x1="300" y1="239" x2="300" y2="233"/>
  <line x1="312" y1="246" x2="317" y2="242"/>
  <line x1="317" y1="258" x2="323" y2="258"/>
  <line x1="288" y1="246" x2="283" y2="242"/>
  <line x1="283" y1="258" x2="277" y2="258"/>
  <line x1="312" y1="270" x2="316" y2="274"/>
</g>
<circle cx="312" cy="247" r="1.6" fill="#8f3b3b"/><circle cx="288" cy="247" r="1.6" fill="#8f3b3b"/>
<text x="300" y="290" text-anchor="middle" font-size="9.5" fill="#5c6672">刺突（HA/NA 等）</text>
<text x="400" y="240" font-size="9.5" fill="#8f3b3b">对脂溶剂敏感</text>
<text x="400" y="255" font-size="9.5" fill="#5c6672">流感 · HIV · HBV</text>
<text x="400" y="270" font-size="9.5" fill="#8f3b3b">脂溶剂可灭活</text>
<text x="400" y="283" font-size="9.5" fill="#5c6672">裸病毒高水平消毒</text>

<!-- 页脚 -->
<rect x="24" y="304" width="432" height="20" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="240" y="318" text-anchor="middle" font-size="9.5" fill="#5c6672">LPCB 压片看产孢结构定丝状真菌 · 玉米吐温琼脂促厚壁孢子与假菌丝（白念鉴定）· 包膜有无决定消毒等级</text>
</svg>
