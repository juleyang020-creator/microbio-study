<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 336" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>RPMI 1640 培养基（真菌药敏标准肉汤）</title>
<desc>标准 RPMI 1640（含 L-谷氨酰胺与酚红、不含碳酸氢钠）＋葡萄糖 2 g/L，MOPS 调 pH 7.0：CLSI M27 肉汤微量稀释法测酵母（念珠菌/隐球菌）抗真菌药 MIC 的标准培养基；丝状真菌药敏同用 RPMI 1640 体系（CLSI M38）；质控菌株：近平滑念珠菌 ATCC 22019、克柔念珠菌 ATCC 6258</desc>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="336" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">RPMI 1640 培养基</text>
<rect x="356" y="14" width="100" height="18" rx="9" fill="#eef1f5"/>
<text x="406" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">药敏试验培养基</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">抗真菌药 MIC 的「标准秤」——配方、缓冲、接种量全部锁定</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 上：配方三要素 ===== -->
<text x="24" y="78" font-size="10.5" font-weight="700" fill="#33404f">为什么是 RPMI 1640（不是普通肉汤）</text>
<g font-size="9.5">
  <rect x="24" y="90" width="140" height="52" rx="7" fill="#eef4fb" stroke="#b9cde4"/>
  <text x="34" y="106" font-weight="700" fill="#1f4e79">营养支持</text>
  <text x="34" y="120" fill="#33404f">L-谷氨酰胺＋葡萄糖 2 g/L</text>
  <text x="34" y="133" fill="#5c6672">真菌生长足够快（24~48 h 可读）</text>

  <rect x="172" y="90" width="140" height="52" rx="7" fill="#f0f6f2" stroke="#c8dcc5"/>
  <text x="182" y="106" font-weight="700" fill="#2f6b45">pH 锁定</text>
  <text x="182" y="120" fill="#33404f">MOPS 缓冲至 pH 7.0</text>
  <text x="182" y="133" fill="#5c6672">不含碳酸氢钠（pH 不漂移）</text>

  <rect x="320" y="90" width="136" height="52" rx="7" fill="#fdf6f0" stroke="#e3c8b8"/>
  <text x="330" y="106" font-weight="700" fill="#33404f">可比性</text>
  <text x="330" y="120" fill="#33404f">全球实验室同一配方</text>
  <text x="330" y="133" fill="#5c6672">MIC 才能互认（折点前提）</text>
</g>

<!-- ===== 中：微量稀释板 ===== -->
<text x="24" y="164" font-size="10.5" font-weight="700" fill="#33404f">肉汤微量稀释读 MIC（96 孔板，倍比稀释）</text>
<g>
  <!-- 一排 8 孔：浊度从深到浅 -->
  <g stroke="#b9c2cc" stroke-width="1.2">
    <rect x="36" y="180" width="34" height="22" rx="3" fill="#e8eef5"/>
    <rect x="76" y="180" width="34" height="22" rx="3" fill="#eef2f7"/>
    <rect x="116" y="180" width="34" height="22" rx="3" fill="#f2f5f9"/>
    <rect x="156" y="180" width="34" height="22" rx="3" fill="#ffffff"/>
    <rect x="196" y="180" width="34" height="22" rx="3" fill="#ffffff"/>
    <rect x="236" y="180" width="34" height="22" rx="3" fill="#ffffff"/>
  </g>
  <text x="53" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">16</text>
  <text x="93" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">8</text>
  <text x="133" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">4</text>
  <text x="173" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">2</text>
  <text x="213" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">1</text>
  <text x="253" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">0.5</text>
</g>
<line x1="156" y1="206" x2="156" y2="216" stroke="#c2413d" stroke-width="1.6"/>
<text x="166" y="218" font-size="9.5" fill="#a3332f">MIC＝第一孔澄清（肉眼判读）</text>
<text x="36" y="218" font-size="9.5" fill="#5c6672">浓度 μg/ml →</text>

<!-- 判读差异 -->
<g font-size="9.5">
  <rect x="290" y="172" width="166" height="52" rx="7" fill="#f5f7f9" stroke="#e3e7ec"/>
  <text x="300" y="188" font-weight="700" fill="#33404f">唑类 vs 棘白菌素</text>
  <text x="300" y="202" fill="#5c6672">唑类终点按 ~50% 抑制的「拖尾」</text>
  <text x="300" y="215" fill="#5c6672">棘白菌素按 100% 抑制（澄清）判读</text>
</g>

<!-- ===== 下：适用与质控 ===== -->
<rect x="24" y="240" width="212" height="52" rx="7" fill="#f0f6f2" stroke="#c8dcc5"/>
<text x="34" y="256" font-size="9.5" font-weight="700" fill="#2f6b45">适用范围</text>
<text x="34" y="270" font-size="9.5" fill="#33404f">酵母：念珠菌属、隐球菌（CLSI M27）</text>
<text x="34" y="284" font-size="9.5" fill="#33404f">丝状真菌：曲霉等（CLSI M38 同体系）</text>

<rect x="244" y="240" width="212" height="52" rx="7" fill="#f0f6f2" stroke="#c8dcc5"/>
<text x="254" y="256" font-size="9.5" font-weight="700" fill="#2f6b45">质控菌株（MIC 须在规定范围）</text>
<text x="254" y="270" font-size="9.5" fill="#33404f">近平滑念珠菌 ATCC 22019</text>
<text x="254" y="284" font-size="9.5" fill="#33404f">克柔念珠菌 ATCC 6258</text>

<!-- 页脚 -->
<rect x="24" y="302" width="432" height="24" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="32" y="318" font-size="9.5" fill="#5c6672"><tspan font-weight="700" fill="#33404f">保存</tspan>　过滤除菌分装，−20℃ 冷冻保存；临用融化复温，不可反复冻融</text>
</svg>
