<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>细菌结构总览（细胞壁 · 表面附属 · 胞内结构）</title>
<desc>G+ 厚肽聚糖（多层交联+壁磷壁酸 WTA 与膜磷壁酸 LTA，TLR2 配体）直接包膜；G- 外膜（LPS：O 抗原-核心多糖-脂质 A，TLR4 配体/内毒素）→周质间隙薄肽聚糖→内膜三层壁；表面：荚膜（多糖抗吞噬，Vi/K 抗原，Quellung）、鞭毛（H 抗原，周生/端生/单端）、菌毛（普通黏附/性菌毛接合）、S 层晶格；胞内：芽孢（DPA-Ca 休眠体，中央/末端/次极端位置鉴别）、异染颗粒（白喉棒状杆菌偏磷酸盐，Albert 异染染色蓝黑）；β-内酰胺类靶位 PBP 即在肽聚糖合成层</desc>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="420" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">细菌结构总览</text>
<rect x="396" y="14" width="60" height="18" rx="9" fill="#eef1f5"/>
<text x="426" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">术语</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">G+ 与 G- 的差别全在「墙」怎么砌——结构决定染色、抗原与药敏</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e7e4dd"/>

<!-- ===== 左：G+ 壁剖面 ===== -->
<text x="118" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f6b45">革兰阳性菌壁（厚肽聚糖）</text>
<!-- 荚膜 -->
<path d="M56,96 Q60,86 76,84 L160,84 Q176,86 180,96 Q176,106 160,108 L76,108 Q60,106 56,96 Z" fill="#dbe9f5" stroke="#9fb7d0" stroke-width="1" stroke-dasharray="3 2"/>
<text x="118" y="99" text-anchor="middle" font-size="9.5" fill="#2b5686">荚膜（多糖，Vi/K 抗原，Quellung）</text>
<!-- S 层 -->
<rect x="64" y="112" width="108" height="5" fill="#c9d4cf"/>
<text x="118" y="127" text-anchor="middle" font-size="9.5" fill="#5c6672">S 层（蛋白晶格，部分菌）</text>
<!-- 肽聚糖厚层 -->
<rect x="64" y="134" width="108" height="42" fill="#e7e2f3" stroke="#8b7fb8" stroke-width="1.4"/>
<g stroke="#8b7fb8" stroke-width="0.8" fill="none">
  <line x1="64" y1="144" x2="172" y2="144"/><line x1="64" y1="155" x2="172" y2="155"/><line x1="64" y1="166" x2="172" y2="166"/>
</g>
<!-- WTA（壁磷壁酸，嵌在肽聚糖内） -->
<path d="M84,138 q5,7 0,14 q-5,7 0,14 q5,7 0,10" fill="none" stroke="#5b4f8a" stroke-width="1.6"/>
<text x="76" y="192" font-size="9.5" fill="#5b4f8a">WTA（连肽聚糖）</text>
<!-- LTA（膜磷壁酸，穿壁锚到膜） -->
<path d="M148,140 q5,8 0,16 q-5,8 0,16 q5,8 0,12" fill="none" stroke="#2b6cb0" stroke-width="1.6"/>
<text x="152" y="192" font-size="9.5" fill="#1f4e79">LTA（锚到膜）</text>
<text x="118" y="206" text-anchor="middle" font-size="9.5" fill="#2f6b45">肽聚糖多层（50% 壁重）＋磷壁酸（TLR2）</text>
<!-- 细胞膜 -->
<rect x="64" y="214" width="108" height="8" fill="#f7ecd4" stroke="#d9b96a"/>
<text x="118" y="232" text-anchor="middle" font-size="9.5" fill="#8a6d2f">细胞膜（磷脂双层）</text>

<!-- 表面附属（G+ 下方） -->
<!-- 鞭毛 -->
<path d="M88,240 C80,256 96,266 88,282" fill="none" stroke="#7d8a98" stroke-width="1.6"/>
<path d="M100,240 C94,258 108,268 100,284" fill="none" stroke="#7d8a98" stroke-width="1.6"/>
<text x="70" y="296" font-size="9.5" fill="#5c6672">周生鞭毛（H 抗原）</text>
<!-- 菌毛 -->
<g stroke="#a8b2bd" stroke-width="1.1">
  <line x1="150" y1="240" x2="146" y2="254"/><line x1="158" y1="240" x2="156" y2="256"/><line x1="166" y1="240" x2="165" y2="254"/>
</g>
<text x="142" y="268" font-size="9.5" fill="#5c6672">菌毛（黏附）</text>

<!-- 胞内结构（G+ 底部） -->
<!-- 芽孢 -->
<ellipse cx="90" cy="318" rx="24" ry="12" fill="#f2ede3" stroke="#a8894e" stroke-width="1.4"/>
<ellipse cx="90" cy="318" rx="15" ry="7.5" fill="#d9c9a4"/>
<text x="90" y="340" text-anchor="middle" font-size="9.5" fill="#8a6d3a">芽孢</text>
<text x="126" y="326" font-size="9.5" fill="#5c6672">中央—炭疽 · 末端—破伤风</text>
<!-- 异染颗粒 -->
<circle cx="170" cy="312" r="4.5" fill="#3d3560"/><circle cx="163" cy="324" r="3.6" fill="#3d3560"/>
<text x="150" y="342" font-size="9.5" fill="#3d3560">异染颗粒</text>
<text x="150" y="354" font-size="9.5" fill="#5c6672">（白喉 Albert）</text>

<!-- ===== 右：G- 壁剖面 ===== -->
<text x="362" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8f3b3b">革兰阴性菌壁（外膜三层）</text>
<!-- 荚膜 -->
<path d="M300,96 Q304,86 320,84 L404,84 Q420,86 424,96 Q420,106 404,108 L320,108 Q304,106 300,96 Z" fill="#dbe9f5" stroke="#9fb7d0" stroke-width="1" stroke-dasharray="3 2"/>
<text x="362" y="99" text-anchor="middle" font-size="9.5" fill="#2b5686">荚膜（K 抗原；Vi＝伤寒荚膜）</text>
<!-- 性菌毛 -->
<path d="M310,100 C304,88 306,80 312,72" fill="none" stroke="#7d8a98" stroke-width="1.5"/>
<text x="296" y="68" text-anchor="end" font-size="9.5" fill="#5c6672">性菌毛（接合）</text>
<!-- 外膜（LPS） -->
<rect x="310" y="116" width="108" height="16" fill="#f5e3e3" stroke="#c98d8d" stroke-width="1.4"/>
<g fill="#b96a6a">
  <circle cx="318" cy="120" r="1.8"/><circle cx="330" cy="120" r="1.8"/><circle cx="342" cy="120" r="1.8"/><circle cx="354" cy="120" r="1.8"/><circle cx="366" cy="120" r="1.8"/><circle cx="378" cy="120" r="1.8"/><circle cx="390" cy="120" r="1.8"/><circle cx="402" cy="120" r="1.8"/>
</g>
<!-- LPS 分子伸出 -->
<g>
  <line x1="310" y1="124" x2="294" y2="124" stroke="#8f3b3b" stroke-width="1.5"/>
  <circle cx="290" cy="124" r="2.4" fill="#8f3b3b"/><circle cx="284" cy="120" r="2" fill="#8f3b3b"/><circle cx="284" cy="128" r="2" fill="#8f3b3b"/>
</g>
<text x="362" y="144" text-anchor="middle" font-size="9.5" fill="#8f3b3b">外膜（LPS：O 抗原-核心-脂质 A）</text>
<!-- 周质间隙+薄肽聚糖 -->
<rect x="310" y="152" width="108" height="8" fill="#f5f0e8" stroke="#e0d8c8"/>
<rect x="310" y="156" width="108" height="3" fill="#e7e2f3" stroke="#8b7fb8" stroke-width="0.7"/>
<text x="362" y="172" text-anchor="middle" font-size="9.5" fill="#5b4f8a">周质间隙（薄肽聚糖 1~2 层）</text>
<!-- 内膜 -->
<rect x="310" y="180" width="108" height="8" fill="#f7ecd4" stroke="#d9b96a"/>
<text x="362" y="198" text-anchor="middle" font-size="9.5" fill="#8a6d2f">内膜（细胞膜）</text>
<!-- 鞭毛 -->
<path d="M386,208 C380,224 394,234 388,250" fill="none" stroke="#7d8a98" stroke-width="1.6"/>
<text x="394" y="264" font-size="9.5" fill="#5c6672">端生鞭毛</text>
<!-- 孔蛋白 -->
<rect x="330" y="116" width="6" height="72" fill="#ffffff" stroke="#c98d8d" stroke-width="0.9"/>
<text x="300" y="228" font-size="9.5" fill="#5c6672">孔蛋白（通道，耐药相关）</text>

<!-- ===== 底部对照表 ===== -->
<rect x="24" y="286" width="432" height="96" rx="8" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="36" y="304" font-size="10" font-weight="700" fill="#1f2733">结构 → 功能 → 检验关联</text>
<line x1="36" y1="312" x2="444" y2="312" stroke="#e3e7ec"/>
<text x="40" y="328" font-size="9.5" fill="#33404f"><tspan font-weight="700">染色</tspan>　结晶紫-碘复合物：G+ 厚壁滞留呈紫，G- 脱色后复染呈红</text>
<text x="40" y="344" font-size="9.5" fill="#33404f"><tspan font-weight="700">抗原</tspan>　O（LPS 侧链）· H（鞭毛）· K/Vi（荚膜）——血清分型三支柱</text>
<text x="40" y="360" font-size="9.5" fill="#33404f"><tspan font-weight="700">药敏</tspan>　PBP 在肽聚糖合成层（β-内酰胺靶位）；G- 外膜是天然屏障（孔蛋白缺失 → 耐药）</text>
<text x="40" y="376" font-size="9.5" fill="#33404f"><tspan font-weight="700">毒力</tspan>　荚膜抗吞噬（Quellung 鉴定）· LTA/LPS 分别激活 TLR2/TLR4（炎症）</text>
</svg>
