<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>抗原虫药（按寄生部位与病种选药）</title><desc>肠道阿米巴须区分腔内药与组织内药并联用；利什曼病用五价锑、米替福新或两性霉素B脂质体；非洲锥虫病按是否累及中枢神经系统分早晚期用药，美洲锥虫病用硝呋莫司或苄硝唑</desc>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
  <marker id="blk" markerWidth="8" markerHeight="12" refX="6" refY="6" orient="auto"><line x1="6" y1="1" x2="6" y2="11" stroke="#c2413d" stroke-width="2.4"/></marker>
</defs>
<rect width="480" height="300" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">抗原虫药（非疟）</text>
<rect x="366" y="14" width="90" height="18" rx="9" fill="#eef2f7"/>
<text x="411" y="27" text-anchor="middle" font-size="10" fill="#5c6672">抗寄生虫 3/3</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">这类药机制各异，临床上按「虫在哪里」而非按机制归类选择</text>
<line x1="24" y1="56" x2="456" y2="56" stroke="#e3e7ec"/>

<!-- 肠道原虫：腔内 vs 组织内 -->
<rect x="24" y="66" width="432" height="72" rx="6" fill="#f7f9fb" stroke="#d6dee8" stroke-width="0.8"/>
<text x="34" y="81" font-size="10" font-weight="700" fill="#1f4e79">肠道原虫 · 溶组织内阿米巴须两类药联用</text>
<rect x="34" y="89" width="196" height="40" rx="5" fill="#fdf1f0" stroke="#e4bdb9" stroke-width="0.8"/>
<text x="132" y="103" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a3332f">组织内（侵入滋养体）</text>
<text x="132" y="117" text-anchor="middle" font-size="9.5" fill="#8a5a57">甲硝唑 / 替硝唑</text>
<rect x="250" y="89" width="196" height="40" rx="5" fill="#eef5f0" stroke="#b7d3c3" stroke-width="0.8"/>
<text x="348" y="103" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2f6b4f">腔内（清除包囊防复发）</text>
<text x="348" y="117" text-anchor="middle" font-size="9.5" fill="#43705c">双碘喹啉｜安特酰胺糠酸酯｜巴龙霉素</text>
<line x1="234" y1="109" x2="246" y2="109" stroke="#33404f" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- 隐孢子虫与贾第虫 -->
<rect x="24" y="146" width="212" height="46" rx="6" fill="#f7f9fb" stroke="#d6dee8" stroke-width="0.8"/>
<text x="34" y="161" font-size="9.5" font-weight="700" fill="#1f4e79">隐孢子虫 / 贾第鞭毛虫</text>
<text x="34" y="175" font-size="9.5" fill="#5c6672">硝唑尼特（FDA 仅批准此两种适应证）</text>
<text x="34" y="187" font-size="9.5" fill="#5c6672">孕妇贾第虫病首选巴龙霉素</text>

<!-- 利什曼 -->
<rect x="244" y="146" width="212" height="46" rx="6" fill="#f7f9fb" stroke="#d6dee8" stroke-width="0.8"/>
<text x="254" y="161" font-size="9.5" font-weight="700" fill="#1f4e79">利什曼病</text>
<text x="254" y="175" font-size="9.5" fill="#5c6672">内脏型首选两性霉素B脂质体</text>
<text x="254" y="187" font-size="9.5" fill="#5c6672">替代：米替福新｜五价锑｜喷他脒</text>

<!-- 锥虫：按分期 -->
<rect x="24" y="200" width="432" height="56" rx="6" fill="#eef1f8" stroke="#7b8ba0" stroke-width="0.9"/>
<text x="34" y="215" font-size="9.5" font-weight="700" fill="#4a5768">锥虫病 · 非洲锥虫按是否累及中枢神经系统换药</text>
<text x="34" y="229" font-size="9.5" fill="#4a5768">早期（血液淋巴期）：苏拉明（罗得西亚）｜喷他脒（冈比亚）</text>
<text x="34" y="241" font-size="9.5" fill="#4a5768">晚期（CNS 期）：美拉胂醇（罗得西亚）｜硝呋莫司＋依氟鸟氨酸（冈比亚，标准一线）</text>
<text x="34" y="252" font-size="9.5" fill="#4a5768">美洲锥虫病（克氏锥虫，恰加斯病）：硝呋莫司｜苄硝唑 —— 仅急性期有效</text>

<!-- 页脚 -->
<rect x="24" y="264" width="432" height="26" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="32" y="278" font-size="9.5" fill="#a3332f">⚠️ 美拉胂醇致反应性脑病达 10% 并与高死亡率相关；依氟鸟氨酸单药对冈比亚锥虫病无效</text>
<text x="32" y="288" font-size="9.5" fill="#93a0ad">腔内药全身吸收差，单用治不了肝脓肿等肠外阿米巴病</text>
</svg>
