<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 356" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>分枝杆菌生化与生长鉴别试验（吡嗪酰胺酶 / 烟酸 / 吐温-80 / 芳香硫酸酯酶 / 耐热触酶 / PNB）</title>
<desc>分枝杆菌六项传统鉴别试验：①吡嗪酰胺酶 Wayne 法阳性呈橙红带（结核＋牛分枝−）；②烟酸试验黄色沉淀（结核蓄积烟酸＋）；③吐温-80 水解 5～10 天转粉红（堪萨斯＋结核−）；④芳香硫酸酯酶加碱显紫红（偶发等快生长群 3 天＋）；⑤68℃ 20 min 耐热触酶（结核复合群失活−，多数 NTM 仍冒泡＋）；⑥PNB（对硝基苯甲酸 500 μg/mL）生长试验（结核复合群受抑不长−，NTM 生长＋）</desc>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="356" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">分枝杆菌生化与生长鉴别试验</text>
<rect x="392" y="14" width="64" height="18" rx="9" fill="#eef2f7"/>
<text x="424" y="27" text-anchor="middle" font-size="10" fill="#5c6672">生化试验</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">六项经典分群轴：四项酶反应 ＋ 68℃ 耐热触酶 ＋ PNB 选择性抑制</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 第一行（3 栏）：吡嗪酰胺酶 · 烟酸 · 吐温-80 ===== -->
<rect x="24" y="66" width="138" height="96" rx="6" fill="#fbfcfd" stroke="#e3e7ec"/>
<text x="32" y="81" font-size="10" font-weight="700" fill="#33404f">① 吡嗪酰胺酶（Wayne）</text>
<text x="32" y="94" font-size="9.5" fill="#5c6672">硫酸亚铁铵显橙红带</text>
<path d="M40,102 L40,142 Q40,150 50,150 Q60,150 60,142 L60,102 Z" fill="#f2ecdd" stroke="#b9c2cc" stroke-width="1.2"/>
<rect x="40" y="106" width="20" height="9" fill="#e8963c"/>
<ellipse cx="50" cy="102" rx="10" ry="3" fill="#eef2f7" stroke="#b9c2cc" stroke-width="1"/>
<text x="70" y="118" font-size="9.5" fill="#b06a1e">表面橙红带＝＋</text>
<text x="70" y="133" font-size="9.5" fill="#33404f">结核分枝 ＋</text>
<text x="70" y="147" font-size="9.5" fill="#5c6672">牛分枝/BCG −</text>

<rect x="171" y="66" width="138" height="96" rx="6" fill="#fbfcfd" stroke="#e3e7ec"/>
<text x="179" y="81" font-size="10" font-weight="700" fill="#33404f">② 烟酸试验（Niacin）</text>
<text x="179" y="94" font-size="9.5" fill="#5c6672">氰溴化物/试纸显黄色</text>
<rect x="181" y="106" width="32" height="22" rx="3" fill="#fdfcf6" stroke="#cfd6de"/>
<rect x="187" y="111" width="20" height="12" rx="2" fill="#f2d541" stroke="#c9a95f" stroke-width="0.8"/>
<text x="197" y="144" text-anchor="middle" font-size="9.5" fill="#8a6d1a">试纸黄</text>
<text x="220" y="118" font-size="9.5" fill="#8a6d1a">黄色反应＝＋</text>
<text x="220" y="133" font-size="9.5" fill="#33404f">人型结核 ＋</text>
<text x="220" y="147" font-size="9.5" fill="#5c6672">多数 NTM −</text>

<rect x="318" y="66" width="138" height="96" rx="6" fill="#fbfcfd" stroke="#e3e7ec"/>
<text x="326" y="81" font-size="10" font-weight="700" fill="#33404f">③ 吐温-80 水解</text>
<text x="326" y="94" font-size="9.5" fill="#5c6672">5～10 d 释油酸转粉红</text>
<path d="M332,102 L332,142 Q332,150 342,150 Q352,150 352,142 L352,102 Z" fill="#f5d0d6" stroke="#b9c2cc" stroke-width="1.2"/>
<ellipse cx="342" cy="102" rx="10" ry="3" fill="#eef2f7" stroke="#b9c2cc" stroke-width="1"/>
<text x="360" y="118" font-size="9.5" fill="#a3332f">琥珀转粉红＝＋</text>
<text x="360" y="133" font-size="9.5" fill="#33404f">堪萨斯分枝 ＋</text>
<text x="360" y="147" font-size="9.5" fill="#5c6672">结核多数 −</text>

<!-- ===== 第二行（3 栏）：芳香硫酸酯酶 · 68℃ 耐热触酶 · PNB 生长 ===== -->
<rect x="24" y="170" width="138" height="96" rx="6" fill="#fbfcfd" stroke="#e3e7ec"/>
<text x="32" y="185" font-size="10" font-weight="700" fill="#33404f">④ 芳香硫酸酯酶</text>
<text x="32" y="198" font-size="9.5" fill="#5c6672">酚酞硫酸酯＋碱显紫红</text>
<rect x="34" y="210" width="32" height="22" rx="3" fill="#fdfcf6" stroke="#cfd6de"/>
<rect x="40" y="215" width="20" height="12" rx="2" fill="#b04a8a"/>
<text x="50" y="248" text-anchor="middle" font-size="9.5" fill="#8a3a5e">紫红</text>
<text x="72" y="222" font-size="9.5" fill="#8a3a5e">加碱紫红＝＋</text>
<text x="72" y="237" font-size="9.5" fill="#33404f">偶发/脓肿 3d＋</text>
<text x="72" y="251" font-size="9.5" fill="#5c6672">戈登 14d＋</text>

<rect x="171" y="170" width="138" height="96" rx="6" fill="#fbfcfd" stroke="#e3e7ec"/>
<text x="179" y="185" font-size="10" font-weight="700" fill="#33404f">⑤ 耐热触酶（68℃）</text>
<text x="179" y="198" font-size="9.5" fill="#5c6672">68℃ 水浴 20 min 加 H₂O₂</text>
<path d="M185,206 L185,246 Q185,254 195,254 Q205,254 205,246 L205,206 Z" fill="#eef4fb" stroke="#b9c2cc" stroke-width="1.2"/>
<circle cx="192" cy="222" r="2.2" fill="#2b6cb0"/><circle cx="198" cy="216" r="2" fill="#2b6cb0"/><circle cx="195" cy="230" r="1.8" fill="#2b6cb0"/>
<ellipse cx="195" cy="206" rx="10" ry="3" fill="#eef2f7" stroke="#b9c2cc" stroke-width="1"/>
<text x="214" y="222" font-size="9.5" fill="#1f4e79">仍冒气泡＝＋</text>
<text x="214" y="237" font-size="9.5" fill="#33404f">多数 NTM ＋</text>
<text x="214" y="251" font-size="9.5" fill="#a3332f">结核/牛分枝 −</text>

<rect x="318" y="170" width="138" height="96" rx="6" fill="#fbfcfd" stroke="#e3e7ec"/>
<text x="326" y="185" font-size="10" font-weight="700" fill="#33404f">⑥ PNB 生长试验</text>
<text x="326" y="198" font-size="9.5" fill="#5c6672">含对硝基苯甲酸罗氏管</text>
<path d="M332,206 L332,246 Q332,254 342,254 Q352,254 352,246 L352,206 Z" fill="#dcefe0" stroke="#8ab896" stroke-width="1.2"/>
<circle cx="342" cy="224" r="2.2" fill="#2f7a45"/><circle cx="340" cy="234" r="2.4" fill="#2f7a45"/>
<ellipse cx="342" cy="206" rx="10" ry="3" fill="#eef2f7" stroke="#8ab896" stroke-width="1"/>
<text x="360" y="222" font-size="9.5" fill="#2f7a45">菌落生长＝＋</text>
<text x="360" y="237" font-size="9.5" fill="#33404f">多数 NTM ＋</text>
<text x="360" y="251" font-size="9.5" fill="#a3332f">结核复合群 −</text>

<!-- ===== 底部：分群主轴与页脚 ===== -->
<text x="240" y="284" text-anchor="middle" font-size="10" font-weight="700" fill="#33404f">核心分流：结核分枝杆菌复合群（MTC）＝ 烟酸＋ · 68℃触酶− · PNB不长−</text>
<text x="240" y="299" text-anchor="middle" font-size="9.5" fill="#5c6672">非结核分枝杆菌（NTM）＝ 多为 68℃触酶＋ · PNB生长＋；再按生长速度（&lt;7d 快群 vs ≥7d 慢群）与产色分种</text>

<!-- 页脚 -->
<rect x="24" y="310" width="432" height="34" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="32" y="324" font-size="9.5" fill="#5c6672"><tspan font-weight="700" fill="#33404f">鉴别要点</tspan>　人型结核 vs 牛分枝：吡嗪酰胺酶（人＋ / 牛−）与 TCH 生长（人＋ / 牛−）</text>
<text x="32" y="338" font-size="9.5" fill="#5c6672">快生长群（偶发/脓肿/龟）3d 芳香硫酸酯酶＋；慢生长群吐温-80 分堪萨斯（＋）与鸟胞内（−）</text>
</svg>
