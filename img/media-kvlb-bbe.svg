<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 336" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>KVLB / BBE 琼脂（厌氧选择培养基）</title>
<desc>KVLB（卡那霉素-万古霉素-冻融血琼脂）：两种抗生素抑制兼性厌氧菌，冻融血促进产黑色素拟杆菌的色素形成，选择性分离拟杆菌属；BBE（拟杆菌胆汁七叶苷琼脂）：脆弱拟杆菌群耐 20% 胆汁并水解七叶苷，产物与铁离子反应使菌落及周围呈黑色，快速分离鉴定；庆大霉素辅助抑制</desc>
<defs>
  <radialGradient id="bbeagar" cx="42%" cy="36%" r="72%"><stop offset="0" stop-color="#f0e6d5"/><stop offset="1" stop-color="#d4bd97"/></radialGradient>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="336" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">KVLB / BBE 琼脂</text>
<rect x="376" y="14" width="80" height="18" rx="9" fill="#eef1f5"/>
<text x="416" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">特殊培养基</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">厌氧菌的「海关」：抗生素放拟杆菌过、拦下其余；胆汁七叶苷再给脆弱群盖章</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 左：BBE 平板 ===== -->
<text x="24" y="80" font-size="10.5" font-weight="700" fill="#33404f">BBE（胆汁七叶苷琼脂）</text>
<circle cx="118" cy="168" r="70" fill="#f0f2f4" stroke="#cdd4db" stroke-width="1.4"/>
<circle cx="118" cy="168" r="66" fill="url(#bbeagar)"/>
<!-- 黑色菌落+晕 -->
<circle cx="100" cy="150" r="12" fill="#3a3226" opacity="0.55"/>
<circle cx="100" cy="150" r="3.6" fill="#1c1a17"/>
<circle cx="98" cy="128" r="6.6" fill="#1f2733"/>
<text x="98" y="131.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">1</text>
<circle cx="144" cy="186" r="9" fill="#3a3226" opacity="0.5"/>
<circle cx="144" cy="186" r="2.8" fill="#1c1a17"/>
<!-- 被抑制的杂菌 -->
<g fill="none" stroke="#bfa87c" stroke-width="1.1" stroke-dasharray="3,2.5">
  <circle cx="166" cy="146" r="6"/><circle cx="76" cy="192" r="5"/>
</g>
<path d="M163,143 l6,6 m0,-6 l-6,6 M73,189 l6,6 m0,-6 l-6,6" stroke="#a8894e" stroke-width="1.2"/>
<text x="118" y="248" text-anchor="middle" font-size="9.5" fill="#5c6672">脆弱拟杆菌群：耐胆汁＋七叶苷 → 黑色</text>
<text x="118" y="260" text-anchor="middle" font-size="9.5" fill="#5c6672">庆大霉素抑兼性厌氧 G⁻ 杆菌</text>

<!-- ===== 右：两种培养基分工 ===== -->
<text x="228" y="80" font-size="10.5" font-weight="700" fill="#33404f">KVLB 管「分离」、BBE 管「快鉴」</text>
<g font-size="9.5">
  <rect x="228" y="92" width="228" height="52" rx="7" fill="#f5f0fa" stroke="#b9a5d9"/>
  <text x="238" y="108" font-weight="700" fill="#5b4f8a">KVLB（冻融血＋卡那/万古）</text>
  <text x="238" y="122" fill="#33404f">卡那霉素+万古霉素抑兼性厌氧菌</text>
  <text x="238" y="135" fill="#5c6672">冻融血促产黑色素拟杆菌色素形成</text>

  <rect x="228" y="152" width="228" height="52" rx="7" fill="#fdf6e3" stroke="#c9a95f"/>
  <text x="238" y="168" font-weight="700" fill="#8a6d2f">BBE（胆汁＋七叶苷＋铁）</text>
  <text x="238" y="182" fill="#33404f">脆弱拟杆菌群耐 20% 胆汁</text>
  <text x="238" y="195" fill="#5c6672">水解七叶苷 → 与 Fe³⁺ 反应 → 黑色</text>
</g>

<!-- 质控 -->
<rect x="228" y="214" width="228" height="40" rx="7" fill="#f0f6f2" stroke="#c8dcc5"/>
<text x="238" y="230" font-size="9.5" font-weight="700" fill="#2f6b45">质控（48 h 厌氧）</text>
<text x="238" y="244" font-size="9.5" fill="#33404f">脆弱拟杆菌 ATCC 25285：菌落＞2 mm，BBE 黑色</text>

<!-- 结论 -->
<text x="240" y="272" text-anchor="middle" font-size="11.5" fill="#33404f">胆汁耐受＋七叶苷水解，是脆弱拟杆菌群的双重身份证</text>

<!-- 页脚 -->
<rect x="24" y="288" width="432" height="36" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="32" y="303" font-size="9.5" fill="#5c6672"><tspan font-weight="700" fill="#33404f">操作</tspan>　厌氧罐/厌氧袋 48 h 判读；保鲜袋抽真空或厌氧产气袋保存培养基</text>
<text x="32" y="316" font-size="9.5" fill="#5c6672">可延至 1 周。黑色只指向脆弱群——定种仍需 MALDI 或厌氧生化谱</text>
</svg>
