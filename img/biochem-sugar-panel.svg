<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>糖发酵试验底物总览（山梨醇 / 阿拉伯糖 / 鼠李糖 / 海藻糖 / 麦芽糖 / 蔗糖 / 木糖 / 肌醇 / 卫矛醇等 15 种）</title>
<desc>各种糖醇底物的发酵管判读一致：阳性变黄（可伴产气），阴性保持紫色；关键鉴别格局——山梨醇：O157:H7−/宋内志贺＋；肌醇：肺炎克雷伯＋/催娩克雷伯−；海藻糖：化脓链球菌＋；蔗糖：霍乱弧菌＋/副溶血−（TCBS 基础）；阿拉伯糖：志贺菌属分群轴</desc>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="300" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">糖发酵底物总览</text>
<rect x="392" y="14" width="64" height="18" rx="9" fill="#eef2f7"/>
<text x="424" y="27" text-anchor="middle" font-size="10" fill="#5c6672">生化试验</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">管子都长一样：变黄＝发酵产酸，倒管积气＝产气——差别在底物与格局</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- 判读示意（一阳一阴） -->
<text x="76" y="78" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33404f">＋ 变黄产气</text>
<path d="M58,86 L58,140 Q58,150 76,150 Q94,150 94,140 L94,86 Z" fill="#f2d541" stroke="#8c96a2" stroke-width="1.3"/>
<rect x="71" y="94" width="10" height="30" rx="2" fill="#ffffff" stroke="#8c96a2" stroke-width="0.7"/>
<rect x="72.5" y="108" width="7" height="14" fill="#f2d541"/>
<ellipse cx="76" cy="86" rx="18" ry="4.2" fill="#f6e7bd" stroke="#8c96a2" stroke-width="1.1"/>
<text x="76" y="166" text-anchor="middle" font-size="9.5" fill="#8a6d1a">紫色 → 黄色</text>
<text x="172" y="78" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33404f">− 保持紫色</text>
<path d="M154,86 L154,140 Q154,150 172,150 Q190,150 190,140 L190,86 Z" fill="#8a5fa8" stroke="#8c96a2" stroke-width="1.3"/>
<ellipse cx="172" cy="86" rx="18" ry="4.2" fill="#c9b8d8" stroke="#8c96a2" stroke-width="1.1"/>
<text x="172" y="166" text-anchor="middle" font-size="9.5" fill="#6b4a86">不变色</text>
<line x1="208" y1="80" x2="208" y2="152" stroke="#e3e7ec"/>

<!-- 底物清单 -->
<text x="228" y="78" font-size="9.5" font-weight="700" fill="#33404f">15 种常用底物</text>
<text x="228" y="94" font-size="9.5" fill="#33404f">山梨醇 · 阿拉伯糖 · 鼠李糖 · 海藻糖</text>
<text x="228" y="107" font-size="9.5" fill="#33404f">麦芽糖 · 蔗糖 · 木糖 · 肌醇</text>
<text x="228" y="120" font-size="9.5" fill="#33404f">侧金盏花醇 · 卫矛醇 · 蜜二糖 · 棉子糖</text>
<text x="228" y="133" font-size="9.5" fill="#33404f">水杨素 · 纤维二糖 · 松三糖</text>
<text x="228" y="152" font-size="9.5" fill="#5c6672">迟缓发酵株 48 h 后才阳——别早下结论</text>

<!-- ===== 关键鉴别格局 ===== -->
<rect x="24" y="176" width="432" height="96" rx="8" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="40" y="196" font-size="10" font-weight="700" fill="#1f2733">关键格局（考试与实战高频）</text>
<text x="40" y="214" font-size="9.5" fill="#33404f">山梨醇：EHEC O157:H7 −（SMAC 无色菌落）· 宋内志贺 ＋ · 霍乱弧菌 ＋</text>
<text x="40" y="230" font-size="9.5" fill="#33404f">蔗糖：霍乱弧菌 ＋（TCBS 黄）· 副溶血弧菌 −（TCBS 绿）· 伤寒沙门 −</text>
<text x="40" y="246" font-size="9.5" fill="#33404f">肌醇：肺炎克雷伯 ＋ · 催娩克雷伯 −（克雷伯属内鉴别）· 沙门多数 −</text>
<text x="40" y="262" font-size="9.5" fill="#33404f">海藻糖：化脓链球菌 ＋ · 木糖：非发酵菌鉴别轴 · 阿拉伯糖：志贺菌分群</text>

<!-- 页脚 -->
<text x="240" y="290" text-anchor="middle" font-size="9.5" fill="#5c6672">蛋白胨水基础＋糖醇＋溴甲酚紫（或酚红）· 35℃ 24～48 h 判读</text>
</svg>
