<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 372" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>外毒素与内毒素对照（分泌蛋白毒素 vs 外膜 LPS）</title>
<desc>外毒素：革兰阳性菌分泌的蛋白毒素，分超抗原（TSST-1/肠毒素→细胞因子风暴）、膜损伤毒素（溶血素/卵磷脂酶→打孔）、A-B 毒素（白喉/破伤风/肉毒/霍乱→胞内酶活）三类，不耐热、可制类毒素疫苗；内毒素：革兰阴性菌外膜 LPS 的脂质 A，细菌裂解释放，经 LBP-CD14-TLR4 激活 NF-κB 致脓毒症休克，耐热 100℃ 不灭活、无类毒素疫苗、鲎试验（LAL）检测</desc>
<defs>
  <radialGradient id="gpos" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#efe9f8"/><stop offset="1" stop-color="#c9b8e2"/></radialGradient>
  <radialGradient id="gneg" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#fbeaea"/><stop offset="1" stop-color="#dfa0a0"/></radialGradient>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="372" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">外毒素 vs 内毒素</text>
<rect x="380" y="14" width="76" height="18" rx="9" fill="#eef1f5"/>
<text x="418" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">致病因素 · 毒素</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">一个是活菌分泌的蛋白武器，一个是菌体裂解后释放的结构碎片</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 左：外毒素 ===== -->
<text x="126" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#6e5a9e">外毒素（G⁺ 分泌）</text>
<!-- G+ 菌体 -->
<circle cx="70" cy="128" r="24" fill="url(#gpos)" stroke="#7a63ad" stroke-width="1.4"/>
<circle cx="62" cy="122" r="3" fill="#8a6fbf"/><circle cx="76" cy="126" r="3" fill="#8a6fbf"/><circle cx="66" cy="136" r="3" fill="#8a6fbf"/>
<text x="70" y="164" text-anchor="middle" font-size="9.5" fill="#5c6672">活菌持续分泌</text>
<!-- 三种毒素 -->
<g stroke="#7a63ad" stroke-width="1.3" marker-end="url(#arr)">
  <line x1="96" y1="112" x2="128" y2="96"/>
  <line x1="96" y1="128" x2="128" y2="128"/>
  <line x1="96" y1="144" x2="128" y2="160"/>
</g>
<!-- 超抗原 -->
<rect x="134" y="86" width="100" height="20" rx="10" fill="#f9e6e4" stroke="#c2413d"/>
<text x="184" y="100" text-anchor="middle" font-size="9.5" fill="#a3332f">超抗原（TSST-1）</text>
<!-- 膜损伤 -->
<rect x="134" y="118" width="100" height="20" rx="10" fill="#f9e6e4" stroke="#c2413d"/>
<text x="184" y="132" text-anchor="middle" font-size="9.5" fill="#a3332f">膜损伤（溶血素）</text>
<!-- A-B 毒素 -->
<rect x="134" y="150" width="100" height="20" rx="10" fill="#f9e6e4" stroke="#c2413d"/>
<text x="184" y="164" text-anchor="middle" font-size="9.5" fill="#a3332f">A-B 毒素（白喉等）</text>
<!-- 宿主细胞与结局 -->
<rect x="252" y="92" width="16" height="72" rx="3" fill="#f7ecd4" stroke="#d9b96a"/>
<text x="276" y="100" font-size="9.5" fill="#33404f">宿主细胞</text>
<text x="276" y="114" font-size="9.5" fill="#5c6672">T 细胞风暴 /</text>
<text x="276" y="127" font-size="9.5" fill="#5c6672">膜打孔 /</text>
<text x="276" y="140" font-size="9.5" fill="#5c6672">胞内酶损伤</text>

<!-- ===== 右：内毒素 ===== -->
<text x="380" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#8f3b3b">内毒素（G⁻ 裂解释放）</text>
<!-- G- 菌体（完整）与裂解碎片 -->
<rect x="330" y="112" width="34" height="14" rx="7" fill="url(#gneg)" stroke="#a85a5a" stroke-width="1.4"/>
<g stroke="#a85a5a" stroke-width="1.4">
  <line x1="336" y1="140" x2="330" y2="150"/><line x1="346" y1="142" x2="344" y2="154"/><line x1="356" y1="140" x2="362" y2="150"/>
</g>
<rect x="326" y="152" width="14" height="7" rx="3.5" fill="url(#gneg)" stroke="#a85a5a" stroke-width="1"/>
<rect x="346" y="156" width="12" height="6" rx="3" fill="url(#gneg)" stroke="#a85a5a" stroke-width="1"/>
<text x="348" y="176" text-anchor="middle" font-size="9.5" fill="#5c6672">菌体裂解 → 释放 LPS</text>
<!-- LPS → TLR4 级联 -->
<g stroke="#8f3b3b" stroke-width="1.3" marker-end="url(#arr)">
  <line x1="368" y1="140" x2="398" y2="128"/>
</g>
<circle cx="414" cy="122" r="12" fill="#e3edf8" stroke="#2b6cb0" stroke-width="1.3"/>
<text x="414" y="126" text-anchor="middle" font-size="9.5" fill="#1f4e79">TLR4</text>
<line x1="414" y1="136" x2="414" y2="152" stroke="#33404f" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="414" y="166" text-anchor="middle" font-size="9.5" fill="#a3332f">TNF-α · IL-1 · IL-6</text>
<text x="414" y="179" text-anchor="middle" font-size="9.5" fill="#5c6672">→ 脓毒症休克</text>

<!-- ===== 对照表 ===== -->
<rect x="24" y="196" width="432" height="126" rx="8" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="36" y="214" font-size="10" font-weight="700" fill="#1f2733">关键对照</text>
<line x1="150" y1="204" x2="150" y2="314" stroke="#e3e7ec"/>
<line x1="310" y1="204" x2="310" y2="314" stroke="#e3e7ec"/>
<text x="88" y="214" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33404f">项目</text>
<text x="230" y="214" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6e5a9e">外毒素</text>
<text x="382" y="214" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8f3b3b">内毒素</text>
<text x="40" y="234" font-size="9.5" fill="#33404f">来源</text>
<text x="160" y="234" font-size="9.5" fill="#5c6672">G⁺ 为主，活菌分泌</text>
<text x="320" y="234" font-size="9.5" fill="#5c6672">G⁻ 外膜，裂解释放</text>
<text x="40" y="252" font-size="9.5" fill="#33404f">本质</text>
<text x="160" y="252" font-size="9.5" fill="#5c6672">蛋白质</text>
<text x="320" y="252" font-size="9.5" fill="#5c6672">脂多糖（脂质 A）</text>
<text x="40" y="270" font-size="9.5" fill="#33404f">耐热</text>
<text x="160" y="270" font-size="9.5" fill="#5c6672">不耐热（60℃ 破坏）</text>
<text x="320" y="270" font-size="9.5" fill="#5c6672">耐热（100℃ 不灭活）</text>
<text x="40" y="288" font-size="9.5" fill="#33404f">疫苗</text>
<text x="160" y="288" font-size="9.5" fill="#5c6672">类毒素疫苗（白喉/破伤风）</text>
<text x="320" y="288" font-size="9.5" fill="#5c6672">无类毒素疫苗</text>
<text x="40" y="306" font-size="9.5" fill="#33404f">检测</text>
<text x="160" y="306" font-size="9.5" fill="#5c6672">依症状与毒素鉴定</text>
<text x="320" y="306" font-size="9.5" fill="#5c6672">鲎试验（LAL）定量</text>

<!-- 页脚 -->
<rect x="24" y="334" width="432" height="26" rx="6" fill="#fdf6f5" stroke="#e3c8c8"/>
<text x="32" y="351" font-size="9.5" fill="#5c6672"><tspan font-weight="700" fill="#a3332f">临床</tspan>　白喉抗毒素要早用；EHEC 的 Stx 致 HUS——抗生素诱导噬菌体释放毒素，禁用</text>
</svg>
