<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 328" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>生长特性试验（温度谱 · 28℃ 分枝杆菌 · 胆汁 · KCN · 荧光素）</title>
<desc>生长温度试验按 25/28/37/42/45℃ 耐受谱鉴别（铜绿 42℃+、耶尔森 25℃ 动力、烟曲霉 45℃+、海/溃疡及快生长分枝杆菌 28℃+而结核−）；20% 胆汁生长试验分群厌氧革兰阴性杆菌（脆弱拟杆菌群+）；KCN 培养基生长看浑浊（克雷伯+沙门−）；King B 紫外下荧光素亮绿色荧光（铜绿/荧光群）</desc>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="328" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">生长特性试验</text>
<rect x="392" y="14" width="64" height="18" rx="9" fill="#eef2f7"/>
<text x="424" y="27" text-anchor="middle" font-size="10" fill="#5c6672">生化试验</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">看不同条件下的生长耐受与色素：温度谱（含 28℃）· 胆汁 · KCN · 荧光素</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 左上：温度谱 ===== -->
<text x="24" y="78" font-size="10.5" font-weight="700" fill="#33404f">生长温度谱（同一菌多管分温孵育）</text>
<!-- 四支温度管：25℃ / 28℃ / 37℃ / 42℃ -->
<g>
  <text x="46" y="96" text-anchor="middle" font-size="9.5" fill="#5c6672">25℃</text>
  <path d="M34,102 L34,144 Q34,152 46,152 Q58,152 58,144 L58,102 Z" fill="#f7f5ee" stroke="#b9c2cc" stroke-width="1.2"/>
  <rect x="34" y="114" width="24" height="34" fill="#dfe6ec"/>
  <ellipse cx="46" cy="102" rx="12" ry="3.2" fill="#eef2f7" stroke="#b9c2cc" stroke-width="1"/>
  <text x="46" y="166" text-anchor="middle" font-size="9.5" fill="#2f7a45">耶尔森＋</text>

  <text x="100" y="96" text-anchor="middle" font-size="9.5" fill="#5c6672">28℃</text>
  <path d="M88,102 L88,144 Q88,152 100,152 Q112,152 112,144 L112,102 Z" fill="#f7f5ee" stroke="#b9c2cc" stroke-width="1.2"/>
  <rect x="88" y="114" width="24" height="34" fill="#dfe6ec"/>
  <ellipse cx="100" cy="102" rx="12" ry="3.2" fill="#eef2f7" stroke="#b9c2cc" stroke-width="1"/>
  <text x="100" y="166" text-anchor="middle" font-size="9.5" fill="#2f7a45">海分枝＋</text>

  <text x="154" y="96" text-anchor="middle" font-size="9.5" fill="#5c6672">37℃</text>
  <path d="M142,102 L142,144 Q142,152 154,152 Q166,152 166,144 L166,102 Z" fill="#f7f5ee" stroke="#b9c2cc" stroke-width="1.2"/>
  <rect x="142" y="114" width="24" height="34" fill="#dfe6ec"/>
  <ellipse cx="154" cy="102" rx="12" ry="3.2" fill="#eef2f7" stroke="#b9c2cc" stroke-width="1"/>
  <text x="154" y="166" text-anchor="middle" font-size="9.5" fill="#5c6672">多数菌＋</text>

  <text x="208" y="96" text-anchor="middle" font-size="9.5" fill="#5c6672">42℃</text>
  <path d="M196,102 L196,144 Q196,152 208,152 Q220,152 220,144 L220,102 Z" fill="#f7f5ee" stroke="#b9c2cc" stroke-width="1.2"/>
  <rect x="196" y="114" width="24" height="34" fill="#dfe6ec"/>
  <ellipse cx="208" cy="102" rx="12" ry="3.2" fill="#eef2f7" stroke="#b9c2cc" stroke-width="1"/>
  <text x="208" y="166" text-anchor="middle" font-size="9.5" fill="#2f7a45">铜绿＋</text>
</g>
<text x="128" y="182" text-anchor="middle" font-size="9.5" fill="#5c6672">28℃分枝杆菌：海/溃疡/快群＋，结核−</text>
<text x="128" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">烟曲霉 45℃＋ · 鲍曼不动 44℃＋/皮特−</text>

<!-- ===== 右上：胆汁生长 ===== -->
<text x="268" y="78" font-size="10.5" font-weight="700" fill="#33404f">胆汁生长（20% 牛磺胆汁）</text>
<text x="268" y="92" font-size="9.5" fill="#5c6672">厌氧革兰阴性杆菌分群轴（BBE 平板基础）</text>
<ellipse cx="312" cy="132" rx="34" ry="20" fill="#c8a86e" fill-opacity="0.35" stroke="#a8894e" stroke-width="1.2"/>
<circle cx="304" cy="128" r="2.6" fill="#8a6d3a"/><circle cx="322" cy="138" r="2.2" fill="#8a6d3a"/>
<text x="312" y="168" text-anchor="middle" font-size="9.5" fill="#2f7a45">生长＝＋：脆弱拟杆菌群</text>
<text x="312" y="182" text-anchor="middle" font-size="9.5" fill="#c2413d">不长＝−：普雷沃/卟啉单胞</text>
<text x="392" y="118" font-size="9.5" fill="#5c6672">粪肠球菌：</text>
<text x="392" y="132" font-size="9.5" fill="#5c6672">胆汁七叶苷＋</text>
<text x="392" y="146" font-size="9.5" fill="#5c6672">消化链球菌−</text>

<!-- ===== 左下：KCN 生长 ===== -->
<text x="24" y="216" font-size="10.5" font-weight="700" fill="#33404f">KCN 生长试验</text>
<text x="24" y="230" font-size="9.5" fill="#5c6672">剧毒！细胞色素氧化酶受抑后能否生长</text>
<path d="M44,238 L44,276 Q44,284 56,284 Q68,284 68,276 L68,238 Z" fill="#f7f5ee" stroke="#b9c2cc" stroke-width="1.2"/>
<rect x="44" y="248" width="24" height="30" fill="#dfe6ec"/>
<ellipse cx="56" cy="238" rx="12" ry="3.2" fill="#eef2f7" stroke="#b9c2cc" stroke-width="1"/>
<text x="56" y="296" text-anchor="middle" font-size="9.5" fill="#5c6672">浑浊＝＋</text>
<text x="80" y="252" font-size="9.5" fill="#33404f">＋：克雷伯/哈夫尼亚</text>
<text x="80" y="266" font-size="9.5" fill="#33404f">　　变形杆菌族</text>
<text x="80" y="280" font-size="9.5" fill="#5c6672">−：沙门菌、志贺菌</text>

<!-- ===== 右下：荧光素（King B 紫外） ===== -->
<text x="248" y="216" font-size="10.5" font-weight="700" fill="#33404f">荧光素产生（King B · 365 nm）</text>
<text x="248" y="230" font-size="9.5" fill="#5c6672">缺铁培养基产 pyoverdin，紫外下亮绿荧光</text>
<ellipse cx="290" cy="260" rx="32" ry="20" fill="#d9f2d0" stroke="#7cb56e" stroke-width="1.2"/>
<ellipse cx="290" cy="260" rx="22" ry="13" fill="#a8e29a" fill-opacity="0.6"/>
<text x="290" y="294" text-anchor="middle" font-size="9.5" fill="#2f7a45">亮绿色荧光</text>
<text x="334" y="250" font-size="9.5" fill="#33404f">＋：铜绿假单胞菌</text>
<text x="334" y="264" font-size="9.5" fill="#5c6672">恶臭/荧光假单胞菌（荧光群）</text>
<text x="334" y="278" font-size="9.5" fill="#5c6672">绿脓菌素（蓝色）需 King A</text>

<!-- 页脚 -->
<rect x="24" y="302" width="432" height="18" rx="4" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="240" y="315" text-anchor="middle" font-size="9.5" fill="#5c6672">冷增菌（4℃）用于耶尔森菌/李斯特菌 · 42℃ 区分铜绿（＋）与荧光/恶臭假单胞菌（−）</text>
</svg>
