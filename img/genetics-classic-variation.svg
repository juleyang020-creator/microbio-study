<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>经典变异现象（S-R · H-O · 位相 · V-W · L 型）</title>
<desc>S-R 变异：传代后光滑型→粗糙型，O 抗原丧失致血清凝集失败（结核/炭疽/鼠疫例外为 R 型强毒；CF 肺内铜绿转黏液型）；H-O 变异：鞭毛丢失（变形杆菌 1% 苯酚抑制迁徙生长）；位相变异：沙门菌双相 H 抗原倒位切换，单相菌需软琼脂诱导回特异相才能分型；V-W 变异：伤寒 Vi 荚膜抗原丢失，初分离 O 不凝集须煮沸破坏；L 型：细胞壁缺陷（β-内酰胺/溶菌酶/高盐诱导），油煎蛋菌落、高渗培养基生长</desc>
<defs>
  <radialGradient id="scol" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#fbfbf8"/><stop offset="1" stop-color="#e3e7ec"/></radialGradient>
  <radialGradient id="rcol" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#f2ede3"/><stop offset="1" stop-color="#c9b98f"/></radialGradient>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="400" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">经典变异现象</text>
<rect x="380" y="14" width="76" height="18" rx="9" fill="#eef1f5"/>
<text x="418" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">遗传与变异</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">菌落变脸、鞭毛丢失、抗原切换——都是鉴定路上的坑</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== S-R ===== -->
<text x="24" y="76" font-size="10.5" font-weight="700" fill="#33404f">S-R 变异（传代后抗原丢失）</text>
<circle cx="70" cy="104" r="18" fill="url(#scol)" stroke="#9fb0c0" stroke-width="1.3"/>
<text x="70" y="108" text-anchor="middle" font-size="9.5" fill="#5c6672">S 光滑</text>
<line x1="94" y1="104" x2="122" y2="104" stroke="#33404f" stroke-width="1.3" marker-end="url(#arr)"/>
<circle cx="150" cy="104" r="18" fill="url(#rcol)" stroke="#a8894e" stroke-width="1.3"/>
<path d="M138,96 l4,4 m12,-6 l4,4 m-16,10 l4,4 m10,-6 l4,4" stroke="#a8894e" stroke-width="1.2"/>
<text x="150" y="108" text-anchor="middle" font-size="9.5" fill="#8a6d3a">R 粗糙</text>
<text x="186" y="100" font-size="9.5" fill="#33404f">O 抗原丧失 → 自凝、血清分型失败</text>
<text x="186" y="113" font-size="9.5" fill="#a3332f">例外：结核/炭疽/鼠疫 R 型反强毒</text>
<text x="186" y="126" font-size="9.5" fill="#5c6672">CF 肺内铜绿 → 黏液型（藻酸盐）</text>

<!-- ===== H-O ===== -->
<text x="24" y="156" font-size="10.5" font-weight="700" fill="#33404f">H-O 变异（丢失鞭毛）</text>
<rect x="60" y="168" width="30" height="12" rx="6" fill="#e8f5f0" stroke="#2f8f83" stroke-width="1.3"/>
<path d="M90,174 q14,-8 20,4" fill="none" stroke="#7d8a98" stroke-width="1.6"/>
<line x1="120" y1="174" x2="148" y2="174" stroke="#33404f" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="158" y="168" width="30" height="12" rx="6" fill="#e8f5f0" stroke="#2f8f83" stroke-width="1.3"/>
<path d="M188,168 l8,8 m0,-8 l-8,8" stroke="#c2413d" stroke-width="1.4"/>
<text x="204" y="174" font-size="9.5" fill="#33404f">1% 苯酚抑制 → 变形杆菌不再迁徙生长</text>
<text x="204" y="187" font-size="9.5" fill="#5c6672">H（Hauch 膜状弥散）/ O（ohne 孤立菌落）</text>

<!-- ===== 位相变异 ===== -->
<text x="24" y="216" font-size="10.5" font-weight="700" fill="#33404f">位相变异（沙门菌双相 H 抗原切换）</text>
<rect x="60" y="228" width="26" height="11" rx="5.5" fill="#e8f5f0" stroke="#2f8f83" stroke-width="1.2"/>
<path d="M86,233 q10,-7 16,2" fill="none" stroke="#7d8a98" stroke-width="1.4"/>
<text x="112" y="237" font-size="9.5" fill="#33404f">第 1 相（特异相 a,b,c…）</text>
<line x1="216" y1="233" x2="244" y2="233" stroke="#33404f" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="244" y1="241" x2="216" y2="241" stroke="#b9c2cc" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="254" y="228" width="26" height="11" rx="5.5" fill="#f2ecfa" stroke="#7a63ad" stroke-width="1.2"/>
<path d="M280,233 q10,-7 16,2" fill="none" stroke="#7a63ad" stroke-width="1.4"/>
<text x="306" y="237" font-size="9.5" fill="#33404f">第 2 相（非特异相 1,2,3…）</text>
<text x="60" y="256" font-size="9.5" fill="#a3332f">单相菌须软琼脂诱导回特异相方能分型</text>

<!-- ===== V-W ===== -->
<text x="24" y="284" font-size="10.5" font-weight="700" fill="#33404f">V-W 变异（伤寒 Vi 抗原丢失）</text>
<circle cx="80" cy="308" r="16" fill="#dbe9f5" stroke="#9fb7d0" stroke-width="1.3" stroke-dasharray="3 2"/>
<circle cx="80" cy="308" r="9" fill="#e8f5f0" stroke="#2f8f83" stroke-width="1.2"/>
<text x="80" y="312" text-anchor="middle" font-size="9.5" fill="#2f6b45">Vi</text>
<text x="112" y="304" font-size="9.5" fill="#33404f">V 型：Vi 遮蔽 → O 不凝集</text>
<line x1="200" y1="308" x2="228" y2="308" stroke="#33404f" stroke-width="1.3" marker-end="url(#arr)"/>
<circle cx="256" cy="308" r="9" fill="#e8f5f0" stroke="#2f8f83" stroke-width="1.2"/>
<text x="278" y="304" font-size="9.5" fill="#33404f">W 型：Vi 丢失 → O 可凝集</text>
<text x="112" y="322" font-size="9.5" fill="#a3332f">煮沸破坏 Vi 后再做 O 凝集；Vi 多糖疫苗基础</text>

<!-- ===== L 型 ===== -->
<text x="24" y="350" font-size="10.5" font-weight="700" fill="#33404f">L 型（细胞壁缺陷）</text>
<ellipse cx="80" cy="366" rx="16" ry="9" fill="url(#rcol)" stroke="#a8894e" stroke-width="1.2"/>
<ellipse cx="80" cy="366" rx="7" ry="4" fill="#8a6d3a"/>
<text x="112" y="362" font-size="9.5" fill="#33404f">「油煎蛋」菌落（中厚边薄）· 高度多形性</text>
<text x="112" y="375" font-size="9.5" fill="#33404f">高渗培养基（3~5% NaCl / 10~20% 蔗糖）才长</text>
<text x="300" y="362" font-size="9.5" fill="#5c6672">β-内酰胺/溶菌酶/胆汁/高盐诱导</text>
<text x="300" y="375" font-size="9.5" fill="#5c6672">常规血平板不长 → 须专门申请 L 型培养</text>
</svg>
