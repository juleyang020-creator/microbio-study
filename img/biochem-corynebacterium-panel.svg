<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 324" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>棒状杆菌、链球菌、葡萄球菌与莫拉菌酶类试验（淀粉水解 / 碱性磷酸酶 / LAP / DNase / 乙酰酯酶）</title>
<desc>淀粉水解试验区分白喉棒杆菌生物型（重型+轻/中型−）；碱性磷酸酶试验白喉−假白喉+（金葡+表葡−）；LAP 试验区分链球菌/肠球菌（+）与片球菌/明串珠菌（−）；DNA 酶与耐热核酸酶确认金葡菌（+）与黏质沙雷菌（+）；乙酰酯酶（吲哚乙酸纸片显蓝）鉴别卡他莫拉菌（+）与弯曲菌（空肠+）</desc>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="324" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">棒状杆菌 · 球菌 · 莫拉菌酶类试验</text>
<rect x="392" y="14" width="64" height="18" rx="9" fill="#eef2f7"/>
<text x="424" y="27" text-anchor="middle" font-size="10" fill="#5c6672">生化试验</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">五项种间鉴别酶：淀粉透明区 · 碱性磷酸酶 · LAP · 耐热 DNase · 乙酰酯酶</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 上排四列：淀粉水解 · 碱性磷酸酶 · LAP · DNase ===== -->
<text x="24" y="78" font-size="10" font-weight="700" fill="#33404f">淀粉水解（白喉分型）</text>
<text x="24" y="91" font-size="9.5" fill="#5c6672">淀粉琼脂＋革兰碘液</text>
<ellipse cx="76" cy="138" rx="48" ry="30" fill="#2c4a7c" stroke="#8c96a2" stroke-width="1.2"/>
<circle cx="76" cy="138" r="15" fill="#f0ece2"/>
<circle cx="76" cy="138" r="4.5" fill="#c8b7a0"/>
<text x="76" y="182" text-anchor="middle" font-size="9.5" fill="#33404f">重型＋（透明区）</text>
<text x="76" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">轻/中型−（全蓝）</text>

<text x="152" y="78" font-size="10" font-weight="700" fill="#33404f">碱性磷酸酶（ALP）</text>
<text x="152" y="91" font-size="9.5" fill="#5c6672">对硝基苯酚磷酸盐底物</text>
<rect x="172" y="106" width="44" height="28" rx="4" fill="#fdfcf6" stroke="#cfd6de"/>
<rect x="182" y="114" width="24" height="12" rx="2" fill="#f2ce4b"/>
<text x="194" y="124" text-anchor="middle" font-size="9.5" fill="#8a6d1a">变黄</text>
<text x="194" y="182" text-anchor="middle" font-size="9.5" fill="#33404f">金葡＋ · 表葡−</text>
<text x="194" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">白喉− · 假白喉＋</text>

<text x="262" y="78" font-size="10" font-weight="700" fill="#33404f">亮氨酸氨肽酶（LAP）</text>
<text x="262" y="91" font-size="9.5" fill="#5c6672">亮氨酸-β-萘胺＋DMACA</text>
<rect x="282" y="106" width="44" height="28" rx="4" fill="#fdfcf6" stroke="#cfd6de"/>
<rect x="292" y="114" width="24" height="12" rx="2" fill="#e06666"/>
<text x="304" y="124" text-anchor="middle" font-size="9.5" fill="#ffffff">变红</text>
<text x="304" y="182" text-anchor="middle" font-size="9.5" fill="#33404f">链球菌/肠球菌 ＋</text>
<text x="304" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">明串珠菌/片球菌 −</text>

<text x="376" y="78" font-size="10" font-weight="700" fill="#33404f">DNA 酶（DNase）</text>
<text x="376" y="91" font-size="9.5" fill="#5c6672">0.2% DNA 琼脂平板</text>
<ellipse cx="416" cy="138" rx="40" ry="30" fill="#e8ecf0" stroke="#b9c2cc" stroke-width="1.2"/>
<circle cx="416" cy="138" r="15" fill="#ffffff"/>
<circle cx="416" cy="138" r="4.5" fill="#c8b7a0"/>
<text x="416" y="182" text-anchor="middle" font-size="9.5" fill="#33404f">透明/粉红环＝＋</text>
<text x="416" y="195" text-anchor="middle" font-size="9.5" fill="#5c6672">金葡/沙雷/卡他＋</text>

<!-- ===== 下排双栏：左 耐热核酸酶 · 右 乙酰酯酶试验 ===== -->
<rect x="24" y="210" width="256" height="72" rx="6" fill="#fbfcfd" stroke="#e3e7ec"/>
<text x="34" y="226" font-size="10" font-weight="700" fill="#33404f">耐热核酸酶（heat-stable DNase · 金葡确认）</text>
<rect x="34" y="236" width="96" height="22" rx="4" fill="#f5f7f9" stroke="#b9c2cc"/>
<text x="82" y="251" text-anchor="middle" font-size="9.5" fill="#33404f">菌液 100℃ 15m</text>
<line x1="132" y1="247" x2="148" y2="247" stroke="#33404f" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="152" y="236" width="118" height="22" rx="4" fill="#e3f3e8" stroke="#2f7a45"/>
<text x="211" y="251" text-anchor="middle" font-size="9.5" fill="#1f5c33">甲苯胺蓝 DNA 粉红晕＋</text>
<text x="34" y="274" font-size="9.5" fill="#5c6672">金葡耐沸仍＋；部分 CoNS 热不稳定酶煮后转−</text>

<rect x="288" y="210" width="168" height="72" rx="6" fill="#fbfcfd" stroke="#e3e7ec"/>
<text x="298" y="226" font-size="10" font-weight="700" fill="#33404f">乙酰酯酶试验（吲哚乙酸）</text>
<circle cx="312" cy="248" r="11" fill="#dbe9f5" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="312" y="251.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f4e79">蓝</text>
<text x="328" y="244" font-size="9.5" fill="#33404f">5 min 内蓝绿色＝＋</text>
<text x="328" y="258" font-size="9.5" fill="#5c6672">＋：卡他莫拉·空肠弯曲</text>
<text x="298" y="274" font-size="9.5" fill="#5c6672">−：淋病奈瑟菌 · 胎儿弯曲菌</text>

<!-- 页脚 -->
<rect x="24" y="290" width="432" height="22" rx="5" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="240" y="305" text-anchor="middle" font-size="9.5" fill="#5c6672">链道酶（DNase B）抗体用于 A 群链球菌感染回顾诊断 · 黏质沙雷菌 DNase 强阳性可与肠杆菌属鉴别</text>
</svg>
