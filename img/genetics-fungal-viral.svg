<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>真菌双相型与病毒变异（形态开关 · 抗原变脸）</title>
<desc>真菌双相型：温度开关——37℃ 体内呈酵母型、25℃ 培养呈霉菌型（球孢子菌/组织胞浆菌/马尔尼菲篮状菌），鉴定须双温培养对照，霉菌型操作须生物安全柜；真菌耐药：ERG11 靶点突变+外排泵（唑类）、ERG3 替代途径（两性霉素 B 罕见）；病毒变异：抗原漂移（点突变→年度疫苗更新）与抗原转换（节段重配→1918/1957/1968/2009 大流行），毒力变异制成减毒活疫苗（脊灰/麻疹）</desc>
<defs>
  <radialGradient id="yeast" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#f2ecfa"/><stop offset="1" stop-color="#c9b8e2"/></radialGradient>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
</defs>
<rect width="480" height="360" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">真菌双相型与病毒变异</text>
<rect x="380" y="14" width="76" height="18" rx="9" fill="#eef1f5"/>
<text x="418" y="27" text-anchor="middle" font-size="9.5" fill="#6b7684">遗传与变异</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">一个按温度切换形态，一个靠换抗原躲过疫苗</text>
<line x1="24" y1="58" x2="456" y2="58" stroke="#e3e7ec"/>

<!-- ===== 左：真菌双相型 ===== -->
<text x="120" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#33404f">真菌双相型：温度开关</text>
<!-- 37℃ 酵母 -->
<circle cx="80" cy="120" r="14" fill="url(#yeast)" stroke="#7a63ad" stroke-width="1.4"/>
<circle cx="94" cy="112" r="6" fill="url(#yeast)" stroke="#7a63ad" stroke-width="1.2"/>
<text x="80" y="148" text-anchor="middle" font-size="9.5" fill="#5b4f8a">37℃ 体内：酵母型</text>
<!-- 双向箭头 -->
<line x1="112" y1="118" x2="146" y2="118" stroke="#33404f" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="146" y1="128" x2="112" y2="128" stroke="#b9c2cc" stroke-width="1.3" marker-end="url(#arr)"/>
<!-- 25℃ 霉菌 -->
<g stroke="#2f8f83" stroke-width="2" fill="none" stroke-linecap="round">
  <path d="M160,140 Q170,110 190,104"/>
  <path d="M172,142 Q186,118 206,116"/>
</g>
<circle cx="192" cy="102" r="5" fill="url(#yeast)" stroke="#2f8f83" stroke-width="1.2"/>
<circle cx="208" cy="114" r="5" fill="url(#yeast)" stroke="#2f8f83" stroke-width="1.2"/>
<text x="186" y="148" text-anchor="middle" font-size="9.5" fill="#2f6b45">25℃ 培养：霉菌型</text>
<text x="120" y="170" text-anchor="middle" font-size="9.5" fill="#33404f">球孢子菌 · 组织胞浆菌 · 马尔尼菲篮状菌</text>
<text x="120" y="184" text-anchor="middle" font-size="9.5" fill="#a3332f">鉴定须双温对照；霉菌型须生物安全柜</text>
<text x="120" y="198" text-anchor="middle" font-size="9.5" fill="#5c6672">耐药：ERG11 突变/外排（唑类）· ERG3（AmB）</text>

<!-- ===== 右：病毒抗原变异 ===== -->
<text x="370" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#33404f">流感病毒：两种变脸速度</text>
<!-- 漂移 -->
<circle cx="320" cy="116" r="13" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.3"/>
<g stroke="#2b6cb0" stroke-width="1.2"><line x1="320" y1="103" x2="320" y2="96"/><line x1="311" y1="108" x2="306" y2="103"/><line x1="329" y1="108" x2="334" y2="103"/></g>
<line x1="338" y1="116" x2="362" y2="116" stroke="#33404f" stroke-width="1.2" marker-end="url(#arr)"/>
<circle cx="382" cy="116" r="13" fill="#eef4fb" stroke="#c2413d" stroke-width="1.3"/>
<g stroke="#c2413d" stroke-width="1.2"><line x1="382" y1="103" x2="382" y2="96"/><line x1="373" y1="108" x2="368" y2="103"/><line x1="391" y1="108" x2="396" y2="103"/></g>
<text x="350" y="106" text-anchor="middle" font-size="9.5" fill="#c2413d">点突变</text>
<text x="350" y="142" text-anchor="middle" font-size="9.5" fill="#33404f">漂移＝小变（年度更新疫苗）</text>
<!-- 转换 -->
<g>
  <rect x="300" y="164" width="22" height="10" rx="2" fill="#b9cde4"/>
  <rect x="324" y="164" width="22" height="10" rx="2" fill="#b9cde4"/>
  <rect x="348" y="164" width="22" height="10" rx="2" fill="#dfa0a0"/>
  <rect x="372" y="164" width="22" height="10" rx="2" fill="#b9cde4"/>
</g>
<text x="350" y="188" text-anchor="middle" font-size="9.5" fill="#33404f">转换＝节段重排（禽流感×人流感）</text>
<text x="350" y="202" text-anchor="middle" font-size="9.5" fill="#a3332f">→ 大流行（1918/1957/1968/2009）</text>

<!-- 底部：毒力变异 -->
<rect x="24" y="228" width="432" height="52" rx="8" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="36" y="246" font-size="10" font-weight="700" fill="#1f2733">毒力变异的应用：减毒活疫苗</text>
<text x="36" y="262" font-size="9.5" fill="#33404f">强毒株 → 传代/宿主适应 → 弱毒株（保免疫原性）：脊髓灰质炎 · 麻疹疫苗</text>
<text x="36" y="276" font-size="9.5" fill="#5c6672">同理：BCG＝牛分枝杆菌 13 年 230 代连续传代的减毒株</text>

<!-- 页脚 -->
<rect x="24" y="296" width="432" height="48" rx="8" fill="#fdf6f5" stroke="#e3c8c8"/>
<text x="32" y="314" font-size="9.5" fill="#5c6672"><tspan font-weight="700" fill="#a3332f">安全</tspan>　双相真菌霉菌型的分生孢子可经吸入感染——球孢子菌是著名实验室</text>
<text x="32" y="328" font-size="9.5" fill="#5c6672">获得性感染病原；病毒非遗传型变异（互补/表型混合）不改变基因型</text>
</svg>
