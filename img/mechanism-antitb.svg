<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<title>抗结核药（四个靶点与各自的耐药基因）</title><desc>异烟肼须经 katG 活化后抑制 InhA 阻断分枝菌酸合成，利福平结合 rpoB 编码的 RNA 聚合酶 β 亚基，乙胺丁醇抑制 embB 编码的阿拉伯糖基转移酶，吡嗪酰胺经 pncA 编码的酶活化且只在酸性环境起效；每个靶点都对应一个可做分子检测的耐药基因</desc>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33404f"/></marker>
  <marker id="blk" markerWidth="8" markerHeight="12" refX="6" refY="6" orient="auto"><line x1="6" y1="1" x2="6" y2="11" stroke="#c2413d" stroke-width="2.4"/></marker>
</defs>
<rect width="480" height="300" fill="#ffffff"/>

<!-- 页眉 -->
<text x="24" y="27" font-size="16" font-weight="700" fill="#1f2733">抗结核药</text>
<rect x="360" y="14" width="96" height="18" rx="9" fill="#eef2f7"/>
<text x="408" y="27" text-anchor="middle" font-size="10" fill="#5c6672">抗分枝杆菌 1/2</text>
<text x="24" y="46" font-size="11.5" fill="#5c6672">一线四联各打一个靶点，每个靶点都对应一个可做分子检测的耐药基因</text>
<line x1="24" y1="56" x2="456" y2="56" stroke="#e3e7ec"/>

<!-- 四个靶点柱 -->
<rect x="24" y="66" width="104" height="122" rx="6" fill="#f7f9fb" stroke="#d6dee8" stroke-width="0.8"/>
<rect x="34" y="74" width="84" height="15" rx="7.5" fill="#f9e6e4" stroke="#c2413d"/>
<text x="76" y="85" text-anchor="middle" font-size="9.5" fill="#a3332f">异烟肼 INH</text>
<text x="76" y="102" text-anchor="middle" font-size="9.5" fill="#7a4b8a">前药：katG 活化</text>
<line x1="76" y1="107" x2="76" y2="119" stroke="#33404f" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="76" y="132" text-anchor="middle" font-size="9.5" fill="#33404f">INH-NADH</text>
<line x1="76" y1="137" x2="76" y2="149" stroke="#c2413d" stroke-width="1.5" marker-end="url(#blk)"/>
<text x="76" y="162" text-anchor="middle" font-size="9.5" fill="#1f4e79">InhA</text>
<text x="76" y="175" text-anchor="middle" font-size="9.5" fill="#5c6672">分枝菌酸合成</text>

<rect x="136" y="66" width="104" height="122" rx="6" fill="#f7f9fb" stroke="#d6dee8" stroke-width="0.8"/>
<rect x="146" y="74" width="84" height="15" rx="7.5" fill="#f9e6e4" stroke="#c2413d"/>
<text x="188" y="85" text-anchor="middle" font-size="9.5" fill="#a3332f">利福平 RIF</text>
<text x="188" y="102" text-anchor="middle" font-size="9.5" fill="#5c6672">亲脂，易入胞</text>
<line x1="188" y1="112" x2="188" y2="128" stroke="#c2413d" stroke-width="1.5" marker-end="url(#blk)"/>
<text x="188" y="142" text-anchor="middle" font-size="9.5" fill="#1f4e79">RNA 聚合酶</text>
<text x="188" y="155" text-anchor="middle" font-size="9.5" fill="#1f4e79">β 亚基</text>
<text x="188" y="175" text-anchor="middle" font-size="9.5" fill="#5c6672">转录阻断</text>

<rect x="248" y="66" width="104" height="122" rx="6" fill="#f7f9fb" stroke="#d6dee8" stroke-width="0.8"/>
<rect x="258" y="74" width="84" height="15" rx="7.5" fill="#f9e6e4" stroke="#c2413d"/>
<text x="300" y="85" text-anchor="middle" font-size="9.5" fill="#a3332f">乙胺丁醇 EMB</text>
<text x="300" y="102" text-anchor="middle" font-size="9.5" fill="#5c6672">仅作用于生长期</text>
<line x1="300" y1="112" x2="300" y2="128" stroke="#c2413d" stroke-width="1.5" marker-end="url(#blk)"/>
<text x="300" y="142" text-anchor="middle" font-size="9.5" fill="#1f4e79">阿拉伯糖基</text>
<text x="300" y="155" text-anchor="middle" font-size="9.5" fill="#1f4e79">转移酶</text>
<text x="300" y="175" text-anchor="middle" font-size="9.5" fill="#5c6672">阿拉伯半乳聚糖</text>

<rect x="360" y="66" width="96" height="122" rx="6" fill="#f7f9fb" stroke="#d6dee8" stroke-width="0.8"/>
<rect x="368" y="74" width="80" height="15" rx="7.5" fill="#f9e6e4" stroke="#c2413d"/>
<text x="408" y="85" text-anchor="middle" font-size="9.5" fill="#a3332f">吡嗪酰胺 PZA</text>
<text x="408" y="102" text-anchor="middle" font-size="9.5" fill="#7a4b8a">前药：pncA 活化</text>
<line x1="408" y1="107" x2="408" y2="119" stroke="#33404f" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="408" y="132" text-anchor="middle" font-size="9.5" fill="#33404f">吡嗪酸</text>
<text x="408" y="150" text-anchor="middle" font-size="9.5" fill="#2f6b4f">仅酸性环境有效</text>
<text x="408" y="168" text-anchor="middle" font-size="9.5" fill="#5c6672">杀非复制期菌</text>
<text x="408" y="181" text-anchor="middle" font-size="9.5" fill="#5c6672">（短程化疗关键）</text>

<!-- 耐药基因带 -->
<rect x="24" y="196" width="432" height="40" rx="6" fill="#eef1f8" stroke="#7b8ba0" stroke-width="0.9"/>
<text x="34" y="210" font-size="9.5" font-weight="700" fill="#4a5768">对应的耐药基因（分子药敏的检测靶点）</text>
<text x="34" y="223" font-size="9.5" fill="#4a5768">katG 占 INH 耐药 30%~60%；inhA 启动子突变为低水平耐药　｜　rpoB 核心区占 RIF 耐药 &gt;96%</text>
<text x="34" y="233" font-size="9.5" fill="#4a5768">embB306 占 EMB 耐药 70%　｜　pncA 占 PZA 耐药 72%~97%</text>

<!-- 页脚 -->
<rect x="24" y="242" width="432" height="48" rx="6" fill="#f5f7f9" stroke="#e3e7ec"/>
<text x="32" y="256" font-size="9.5" fill="#a3332f">⚠️ PZA 药敏必须把培养基调成酸性，否则测不出耐药——这是最易出错的一步</text>
<text x="32" y="269" font-size="9.5" fill="#a3332f">⚠️ EMB 的体外 MIC 与 MAC 的临床疗效不相关，不推荐作 MAC 药敏的测试药物</text>
<text x="32" y="283" font-size="9.5" fill="#93a0ad">约 30% 利福平耐药株对利福布丁/利福喷丁仍敏感（取决于 rpoB 突变位点）</text>
</svg>
